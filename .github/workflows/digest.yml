name: digest

# THE WEEK IN ONE EMAIL, asked for by the owner on 2026-10-15 beside the per-source issues and the
# status page: how many runs there were, what keeps failing, which budgets moved, and what the
# naming job used. It was an issue until 2026-11-10, when the owner ruled that issues are for
# things that need doing. See adapters/digest.py and adapters/mail.py. The run summary keeps a copy.
on:
  schedule:
    - cron: "17 0 * * 1"        # Monday 09:17 JST, clear of both update runs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0            # the digest reads a week of history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # THE LATEST PUBLISHED STORE, for the budgets each run measured. A week with no store is a
      # digest without that list, not a failed digest.
      - name: Fetch the latest store
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern corpus.sqlite -D "$RUNNER_TEMP" || true
      - name: Write the digest
        run: python3 adapters/digest.py --store "$RUNNER_TEMP/corpus.sqlite" > digest.md
      - name: Keep a copy in the run summary
        run: cat digest.md >> "$GITHUB_STEP_SUMMARY"
      # An unconfigured account fails the job, and GitHub reports a failed scheduled run.
      - name: Email it
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python3 adapters/mail.py --subject "Yurarium weekly digest: $(TZ=Asia/Tokyo date +%F)" digest.md
