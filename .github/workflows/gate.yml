# The blocking copy of the data gate.
#
# .githooks/pre-push runs this same command, but core.hooksPath is per-clone local config: a fresh
# clone has no hooks until install.sh runs, and --no-verify bypasses them by design. So the gate
# needs a copy that does not depend on the developer's machine — the same reasoning the leak guard
# sets out for itself.
#
# This one BLOCKS. It runs where a person is present to fix what it finds, which is the whole basis
# for treating check-in differently from the unattended build.
name: gate
on:
  pull_request:
  push:
    branches-ignore: [main]     # main is what the unattended update commits to; see update.yml
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml sudachipy sudachidict-core

      - name: Unit tests
        run: |
          python3 adapters/names/test_names.py
          python3 adapters/test_crossplatform.py
          python3 adapters/gigaviewer/test_dates.py

      # Without build output the invariants have nothing to read, and a gate that silently passes
      # because it found nothing is the failure this project keeps hitting. Build first.
      - name: Build
        run: python3 build.py

      - name: Gate — all right or no go
        run: python3 check.py --gate --no-tighten
