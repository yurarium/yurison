# The blocking copy of the data gate.
#
# .githooks/pre-push runs this same command, but core.hooksPath is per-clone local config: a fresh
# clone has no hooks until install.sh runs, and --no-verify bypasses them by design. So the gate
# needs a copy that does not depend on the developer's machine — the same reasoning the leak guard
# sets out for itself.
#
# This one BLOCKS. It runs where a person is present to fix what it finds, which is the whole basis
# for treating check-in differently from the unattended build.
name: gate
# MAIN IS IN, AND NEEDS NO CONDITION TO KEEP THE BOT OUT. This read `branches-ignore: [main]`,
# reasoned as "main is what the unattended update commits to". That is right about the bot and
# blind to the difference between the bot and a person: six code pushes to main on 2026-08-11 ran
# no tests and no gate, only the leak guard, and the twelve budget rises they carried were found by
# running check.py by hand a day later.
#
# A push authenticated with GITHUB_TOKEN does not trigger `on: push` workflows, which update.yml
# already documents and which was checked rather than trusted: the update run's own commit 4415905
# triggered nothing at all, while every other commit that day triggered leak-guard. So the
# unattended update stays out of this gate by construction, and no actor test can drift from it.
on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml pyflakes sudachipy sudachidict-core

      # THE SITE IS NOT CLONED ANY MORE, §11. Four suites used to read `../yurarium.github.io`
      # and this job had to fetch it; what a reader is SHOWN is checked in the repository that
      # renders it now, and nothing here names that repository at all.
      - name: Build
        run: python3 build.py

      # `checks.json`, WHICH `status.py` READS. Three files the checks need are written by three
      # different passes, and this job had none of them: build.py writes the data, this writes the
      # report, and status.py turns the report into the status page's own. update.yml runs all
      # three in this order and has since it was written.
      # ── THE SCHEMA REFUSES WHAT THE CHECKS REPORT ────────────────────────────────────────────
      #
      # `adapters/relational/schema.sql` opens by naming five invariants in check.py that are
      # foreign keys written out as Python, "and they run after the damage rather than refusing
      # it". Two of them stop being expressible at all once the model is relational, because a page
      # can only list what an edge says.
      #
      # NONE OF THAT WAS REACHING ANYTHING. The store was compiled only by the weekly
      # equivalence run, so `PRAGMA foreign_keys = ON` never met a pull request and a dangling
      # identifier was reported by a check rather than refused by a constraint. Building it here
      # costs 6.9s against a 35.6s build, so the cost argument that kept it out does not survive
      # measurement. GATE-PLAN section 4.
      #
      # THE FIVE CHECKS STAY FOR NOW, deliberately. A constraint that has never refused anything in
      # this repository has not yet earned the retirement of a check that has: three of the five
      # docstrings name real faults they caught. Retire them once both have run together and agreed.
      # THE BUILD ABOVE IS THAT COMPILE NOW. This ran `relational --build`, a second rebuild from
      # `data/build`, and §13 stopped writing those files: the step loaded no works and handed back
      # 153 foreign-key refusals on `superseded`, which is the loader saying nothing useful about
      # data that is fine. It failed that way for three pushes.
      #
      # WHAT IT WAS FOR IS STILL DONE. `build.py` compiles the store on this runner with
      # `PRAGMA foreign_keys = ON` and quarantine OFF, so a row the schema will not admit fails the
      # job, which is the whole of what this step asked for. What is lost is the SECOND, independent
      # load from the emitted files, and that comparison stopped existing when the files did.

      - name: Invariants and budgets, reported so the status page has them
        run: python3 check.py --runtime

      # AND THE TWO FILES THE CHECKS READ THAT `build.py` DOES NOT WRITE. `status.json` is
      # `adapters/status.py`'s, and `inv_status_page_shows_no_japanese_of_its_own` reads it: with
      # the file absent the check returns no violations, so `--self-test` plants its canary and
      # catches nothing, and the suite fails for having proved nothing rather than for finding
      # anything. `update.yml` has run these since it was written and this job never had them.
      - name: The ledger and the status page's data
        run: |
          python3 adapters/ledger.py
          python3 adapters/status.py

      - name: Unit tests
        run: |
          ./test.py
          ./test.py --canary

      # THE SOURCE TIER BLOCKS AND THE DATA TIER REPORTS (B3). This job runs against the corpus
      # that is committed, and the unattended update commits new source data every night, so a
      # budget counting works rises here with nothing in the push responsible: five did so on
      # 2026-08-11 and each stopped a commit that was about code. The invariants still block, and a
      # budget that could not be measured still blocks, because neither is a count drifting.
      #
      # Accepting a data rise stays a person's job: `./check.py --gate` by hand, with the recorded
      # value edited and a reason given. Nothing is hidden either way — the number is in
      # `checks.json` and on the status page whichever tier it is in.
      - name: Gate — all right or no go
        run: python3 check.py --gate --no-tighten --data-advisory
