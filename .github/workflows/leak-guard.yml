name: leak-guard

# Server-side, un-bypassable backstop for the local .githooks guard: needs no clone-time setup and runs on
# every push. github.com has no pre-receive, so this detects right after the push (contained while private)
# rather than blocking before it. The guard self-tests against a canary, so a broken run fails, not passes.
on: [push, pull_request]

# Superseded runs are cancelled. This is safe to do to a fail-closed security control ONLY because
# both checks are whole-state at HEAD rather than incremental: `identity HEAD` walks every commit
# reachable from HEAD, and `content tree` scans the entire working tree. The newest run therefore
# covers everything a cancelled one would have. Do not add an incremental range check here without
# removing this.
concurrency:
  group: leak-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leak-guard:
    # A same-repo branch with an open PR fires both events and pays twice. Push covers our own
    # work; the pull_request event is kept solely for forks, where the push event does not reach us.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10          # the job takes well under a minute; this bounds a hang
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — identity is checked over every commit

      - name: Require the content-denylist secret (fail closed if unset)
        env:
          LEAK_DENY: ${{ secrets.LEAK_DENY }}
        run: |
          if [ -z "${LEAK_DENY}" ]; then
            echo "::error::LEAK_DENY secret is not set — the content guard would be a no-op. Set it in repo secrets."
            exit 1
          fi

      - name: Identity + content leak guard (self-testing)
        env:
          LEAK_DENY: ${{ secrets.LEAK_DENY }}
        run: |
          chmod +x .githooks/leak-guard.sh
          .githooks/leak-guard.sh identity HEAD
          .githooks/leak-guard.sh content tree
