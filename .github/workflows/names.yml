name: names

# THE NAMING JOB BY HAND. The update runs it after every compile and before it publishes, through
# `.github/actions/naming`, so names and one-shot verdicts reach a reader in the store they were
# written for. This runs the same steps on demand: from the store the update last published, which
# its build updates in place and so keeps what only the update writes, and publishing the result
# when the work was committed and pushed. Repository variables, all optional: NAMING_MODEL (default
# sonnet), NAMING_MAX_TURNS (default 60), NAMING_LIMIT (items per question, default 12),
# CLAUDE_CODE_VERSION (default latest).
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# THE UPDATE'S OWN GROUP, so the two never write the repository at once.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # FROM THE STORE THE UPDATE PUBLISHED. Compiled from scratch it would lack what only the
      # update writes, the source health and the run's census among them. A run that cannot fetch
      # it still names; it does not publish.
      - name: Start from the store the update published
        id: store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "${{ github.repository }}" --pattern corpus.sqlite \
               --dir "$RUNNER_TEMP/store"; then
            mkdir -p data && cp "$RUNNER_TEMP/store/corpus.sqlite" data/relational.db
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no published store to start from; this run names and does not publish"
          fi

      - name: Compile
        run: python3 build.py --unattended

      - name: Names and one-shot verdicts
        id: naming
        uses: ./.github/actions/naming
        with:
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          model: ${{ vars.NAMING_MODEL || 'sonnet' }}
          max-turns: ${{ vars.NAMING_MAX_TURNS || '60' }}
          limit: ${{ vars.NAMING_LIMIT || '12' }}
          claude-version: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}

      - name: Publish the store with the names in it
        id: publish
        if: steps.naming.outputs.pushed == 'yes' && steps.naming.outputs.outcome == 'committed' && steps.store.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 adapters/relational/__init__.py --publish corpus.sqlite
          TAG="store-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" corpus.sqlite --title "$TAG" \
            --notes "The compiled corpus, with the names run ${{ github.run_id }} wrote. A consumer \
          reads \`store_stamp\` and refuses what it does not know."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Tell a consumer the store has moved
        if: steps.publish.outputs.tag != '' && vars.CONSUMER_REPO != '' && vars.CONSUMER_WORKFLOW != ''
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_TOKEN }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          gh workflow run "${{ vars.CONSUMER_WORKFLOW }}" \
            --repo "${{ vars.CONSUMER_REPO }}" --field release="$TAG" \
          || echo "::warning::the consumer at ${{ vars.CONSUMER_REPO }} was not reachable; \
          $TAG is published and its own schedule will find it"
