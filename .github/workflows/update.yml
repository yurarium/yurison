name: update

# Steady-state run: discover, fetch, compile, publish. See RUNBOOK-github.md.
#
# DELIBERATELY MANUAL-ONLY FOR NOW. The schedule is commented out, because merging this with it
# live would start the job hitting external sites on a timer before anyone had watched it run once.
# Uncomment when you have one green workflow_dispatch and a look
# at the diff it produced.
on:
  workflow_dispatch:
    inputs:
      skip_browser:
        description: "Skip stage C (the browser adapters)"
        type: boolean
        default: false
  # Measured 2026-08-03, from 10,216 dated feed entries. 98% of releases land in three hours JST:
  # 00:00 (42%, 少年ジャンプ+ and コミックDAYS), 11:00 (32%, 一迅プラス), 12:00 (24%, the Coamix and
  # Mag titles). Real spread exists outside those, so these times reduce LATENCY rather than
  # decide coverage: the window-depth rule is what guarantees nothing is missed, and an off-peak
  # release simply waits for the next run.
  #
  # Times are 30 minutes behind each cluster, to let the feeds settle, and off the hour because
  # everything cron'd at :00 queues behind the rest of GitHub.
  # schedule:
  #   - cron: "37 15 * * *"   # 00:37 JST, after the midnight batch. The most valuable single run.
  #   - cron: "07 3 * * *"    # 12:07 JST, catching the 11:00 and 12:00 clusters together.
  #   - cron: "17 10 * * *"   # 19:17 JST, the small evening tail plus a retry margin.

concurrency:
  group: update
  cancel-in-progress: false   # two runs writing data/source/ at once is not a race worth having

permissions:
  contents: write

env:
  CACHE: .cache
  # WHERE `adapters/paths.py` LOOKS, which is `$YURI_CACHE` or the directory beside the checkout.
  # `acceptance.py` reads `paths.cache("webcomics-cache")` unconditionally, with no flag to point
  # it elsewhere, so with this unset it read a directory nothing writes and measured Web漫画アンテナ
  # coverage as 0 works out of 0. That prints as 0.0%, which is below the 90% floor, and the step
  # that runs it blocks the job. Stage 0 fetches exactly those pages; they now land where the
  # measure reads them, inside .cache so the restore carries them between runs.
  YURI_CACHE: .cache

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml pyflakes sudachipy sudachidict-core

      # THE SITE REPOSITORY, WHICH SEVERAL CHECKS READ. `kari/app.js` and `kari/status.html` are the
      # interface's own source, and `check.py` asks questions of them that have nothing to do with a
      # deployment: which renderer a name reaches a page through, whether both lines of a bilingual
      # row get one, whether status.html carries Japanese of its own. `adapters/lint/entrypoints.py`
      # reads app.js too. With no site beside the checkout those checks read nothing, three canaries
      # in `--self-test` went uncaught and entrypoints raised FileNotFoundError, so the two steps
      # that run them blocked the job. Cloned over HTTPS because the repository is public and this
      # needs no key; the deploy step still clones its own writable copy with the SSH key.
      # THE SITE IS NOT CLONED ANY MORE, §11. The suites that read it moved to the repository
      # that renders it, and nothing here names it.
      - name: Confirm a browser is present
        id: browser
        run: |
          for c in google-chrome chromium chromium-browser; do
            p=$(command -v $c || true)
            if [ -n "$p" ]; then echo "found $p"; echo "present=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "::warning::no chromium on the runner — stage C will be skipped"
          echo "present=no" >> "$GITHUB_OUTPUT"

      # RESTORE AND SAVE ARE SEPARATE STEPS so the save can run on a failed job. `actions/cache`
      # only saves when the job succeeds, and the two runs on 2026-08-10 both paid the full
      # cold-cache cost for that reason: the first fetched for 19 minutes, died in the compile, and
      # threw away everything it had read, so the second started from nothing again. Fetching is
      # the dominant cost of this workflow and it is polite, paced traffic against other people's
      # servers, so re-reading pages a failed run already read is the expensive kind of waste.
      #
      # The key is the run id and so never hits; `restore-keys: fetch-` is what does the restoring,
      # taking the newest cache with that prefix. GitHub evicts a cache untouched for 7 days.
      - name: Restore fetches and rendered DOMs
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: .cache
          key: fetch-${{ github.run_id }}
          restore-keys: fetch-

      - name: Set the retrieval date once, for every adapter
        # JST, not UTC. Every publication date in this database is Japanese and stated in JST, and
        # the most valuable run of the day sits just after midnight Tokyo, which is 15:30 UTC on the
        # PREVIOUS UTC day. Dating that run from UTC records a chapter as retrieved the day before
        # it was published, which reads later as a fault in the data rather than in the clock.
        run: echo "R=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"

      # ── Stage 0 — the work queue. Everything downstream reads what this writes. ───────────────
      # webcomics-works.yaml and webcomics-gap.yaml are the inputs to comicfuz, kadokomi,
      # nicovideo, webpages and generic. This is a dependency, not a report, and it runs first.
      # Web漫画アンテナ stays Tier C throughout: it says a work exists and where, and nothing here
      # becomes a record.
      # DISCOVERY IS NOT THE BUILD, so this reports and does not block. It reads Web漫画アンテナ, a
      # Tier C source that says a work exists and attests nothing, and its health check refuses to
      # WRITE when it distrusts what it read, which leaves the committed coverage files standing.
      # A refusal costs a run its new candidates and nothing else.
      #
      # IT WAS OUT OF THIS WORKFLOW FOR AN HOUR ON 2026-08-10, on my reasoning that the host was
      # refusing the runner. It was not: webcomics.jp had added an attribute to the container the
      # parser splits on, and the pass read 0 entries everywhere, including here. Removing the step
      # would have made a parser fix invisible for as long as nobody ran it by hand.
      # 百合ナビ RUNS HERE TOO, AND RAN NOWHERE AT ALL. Its queue is where a work announced on a
      # platform this reads is first heard of, and the pass writing it was in no workflow: the file
      # was last written on 2026-08-01 by hand. A discovery source nothing runs is a discovery
      # source that has stopped, and nothing said so.
      #
      # BEFORE `coverage.py`, because that is what merges an admitted candidate into the target
      # list, and both run before the adapters that read it. A work announced this morning is
      # therefore fetched this morning. See `adapters/admit.py` for what admits one.
      - name: Stage 0 — discovery queue
        continue-on-error: true
        run: |
          python3 adapters/yurinavi/discover.py --out data/queue \
            --cache "$CACHE/yurinavi-cache" --retrieved "$R"
          python3 adapters/webcomics/coverage.py --out data/coverage \
            --cache "$CACHE/webcomics-cache" --pages 8 --retrieved "$R" --force

      # ── Stage A — feeds, APIs and server-rendered markup. No browser. ────────────────────
      # The commands live in adapters/stage-a.yaml so they can be run by hand exactly as CI runs
      # them, and so a failure names the adapter that failed instead of vanishing into `|| true`.
      # They run CONCURRENTLY: they address different publishers, each still paces its own host,
      # and eleven adapters no longer queue behind each other's sleep.
      # ONE ADAPTER MUST NOT COST THE NIGHT (B2). All thirteen commands here are required, and
      # `run_stage.py` returns 1 if any of them fails, which failed this step and stopped the job
      # before the compile. So a single publisher changing a feed's shape withheld the other twelve
      # platforms' updates as well as its own, and the site kept yesterday's everything.
      #
      # THE OWNER'S RULE IS WHAT THIS IS SHAPED BY: partially processing new information is an
      # acceptable failure, publishing a site where existing information is missing in part is not.
      # An adapter that fails writes nothing, so its source file keeps every row it had and the
      # compile publishes that platform exactly as it stood. Nothing is lost, only not gained.
      #
      # IT IS NOT SWALLOWED. `run_stage.py` names each failing adapter and its stderr, the step
      # still goes red, the source file's `age_days` climbs on the status page, and `Stage A failed`
      # below fails the JOB after the data is published rather than instead of it.
      - name: Stage A — feeds and APIs
        id: stage_a
        continue-on-error: true
        run: |
          python3 adapters/run_stage.py adapters/stage-a.yaml \
            --retrieved "$R" --cache "$CACHE" --workers 6

      # WHERE THE FIXTURES GET CHECKED AGAINST REALITY. A committed fixture is a page as it stood
      # on the day it was captured, and the parser it pins can pass against that page for ever
      # while failing against today's. This re-derives each one from the cache entry it names, so
      # it needs no network and it runs here because the caches were refilled a step ago.
      #
      # IT REPORTS AND EXITS 0. A page that has moved is worth a person reading, and it is no
      # reason to fail an unattended update; a check that fires on somebody else's release
      # schedule gets switched off rather than obeyed.
      - name: Fixtures against today's pages (reports, does not block)
        continue-on-error: true
        run: python3 adapters/fixtures.py recheck

      # ── Stage C — browser. Slow, flaky by nature, must not cost the run. ──────────────────────
      - name: Stage C — browser adapters
        if: ${{ steps.browser.outputs.present == 'yes' && !inputs.skip_browser }}
        continue-on-error: true
        timeout-minutes: 50
        run: |
          python3 adapters/render/releases.py    --targets data/coverage/render-targets.yaml \
            --out data/source/webpages --cache "$CACHE/render" --limit-per-host 140 --retrieved "$R"
          python3 adapters/remaining/releases.py --works data/coverage/remaining.yaml \
            --out data/source/webpages --cache "$CACHE/remaining" --retrieved "$R"

      # ── Stage D — compile. This one is allowed to fail the run. ───────────────────────────────
      - name: Compile
        run: python3 build.py --unattended

      # ── WHAT THE COMPILED DATABASE IS MISSING, which only a compile can say ────────────────
      #
      # `shopquery` looks for works with a web serialisation and no print edition, which is a
      # question about the COMPILED form, so it cannot run in Stage A: nothing has compiled yet. It
      # sat there anyway and died on a missing `data/build/series.json` on every CI run since it was
      # added, and it was marked optional, so nobody was told. On a developer's machine it read the
      # last build's answer, which is why it looked like it worked.
      #
      # IT ASKS THE STORE NOW, §11, so the question goes to the compiled form rather than out
      # through a file the store emits and back in.
      - name: Ask the shops what the compile says is missing
        continue-on-error: true
        run: |
          python3 adapters/shopquery/capture.py --out data/queue/shop-query.yaml \
            --cache "$CACHE/shopquery-cache" --retrieved "$R"

      # ── Stage E — names. ──────────────────────────────────────────────────────────────────────
      #
      # AFTER COMPILE, because every pass takes its worklist from `data/build/series.json` and the
      # feed files beside it. A work that arrived in this run exists nowhere else yet, so a pass
      # run before Compile would be reading yesterday's corpus and would not see it.
      #
      # WHY THIS STEP EXISTS AT ALL. Nothing ran these passes on a schedule. `build.py` imports
      # `pass4_analyser` for its functions and runs no pass, and Stage A runs thirteen capture
      # adapters and no pass, so a work entering the corpus carried whatever the store already held
      # until somebody ran `resolve.py` by hand. On 2026-08-12 that was 96 works rendering in
      # Japanese in English-only mode, 95 of them with a title the platform prints in Latin that
      # `pass0_cache` has always had a rule for. WORKS-PLAN section 1.
      #
      # ORDER: pass 1 before pass 0, which is the order `resolve.py` uses and for its reason. Pass
      # 1's readings are `surface`, the highest rank there is, so nothing later can displace them
      # and every pass after it gets a smaller queue.
      #
      # `--surfaces-only` IS THE WHOLE OF WHY PASS 0 CAN BE HERE. Its handle hunt reads every
      # cached page, 131,784 files and about twenty-five minutes, looking for evidence that changes
      # when a cache changes rather than when a work arrives. The step this run needs is the one
      # that costs milliseconds. The walk stays a thing somebody runs deliberately.
      #
      # NONE OF THESE REACH THE NETWORK. Pass 2 and pass 3 do and are deliberately absent.
      - name: Name what this run brought in
        run: |
          python3 adapters/names/resolve.py --run 1
          python3 adapters/names/pass0_cache.py --surfaces-only
          python3 adapters/names/pass4_analyser.py
          python3 adapters/names/curate.py --apply

      # A SECOND COMPILE ONLY WHERE THERE IS SOMETHING TO COMPILE. The passes above write into
      # data/names, and the build joins those names onto rows, so a name found after Compile
      # reaches nobody until the next one. Rebuilding unconditionally would pay for a full compile
      # on every run to catch the runs that brought in a new work; asking git whether the store
      # actually moved costs nothing and is exact.
      - name: Compile again, if the passes named anything
        run: |
          python3 - <<'PY'
          import subprocess, sys
          diff = subprocess.run(["git", "diff", "-U0", "--", "data/names"],
                                capture_output=True, text=True).stdout.splitlines()
          # `generated:` IS A DATESTAMP AND NOT A NAME. Every compaction rewrites it, so a plain
          # `git diff --quiet` reports the store as changed on a run that named nothing at all,
          # which would rebuild every day and make this step's own reason for existing false.
          # Caught by running the sequence by hand: the whole diff was four dates.
          moved = [l for l in diff
                   if l[:1] in "+-" and not l.startswith(("+++", "---"))
                   and not l[1:].lstrip().startswith("generated:")]
          if not moved:
              print("the passes named nothing new; this build already carries every name we hold")
              raise SystemExit(0)
          print(f"{len(moved)} line(s) of names moved; compiling again")
          raise SystemExit(subprocess.run([sys.executable, "build.py"]).returncode)
          PY

      # The hooks in .githooks are per-clone local config — a fresh checkout has none, which is
      # exactly why the leak guard documents CI as its backstop. The same argument applies to the
      # data gate, so it runs here too.
      #
      # RUNTIME, not gate. This job publishes an unattended update and the site must keep updating:
      # a violated invariant has already degraded to the fallback it names, and what matters here is
      # that the count is recorded and visible. The blocking copy runs at pre-push and on pull
      # requests, where someone is present to fix it.
      # THE SCHEMA REFUSES WHAT THE CHECKS REPORT. See gate.yml for the argument; the short form is
      # that five invariants in check.py are foreign keys written out as Python, and until now the
      # store carrying those constraints was compiled only by the weekly equivalence run. 6.9s.
      #
      # OPTIONAL HERE AND BLOCKING ON A PULL REQUEST, which is the split this workflow already
      # makes everywhere: an unattended update must keep publishing, and the place to refuse a
      # dangling identifier is where somebody is present to fix it.
      # THE STORE IS BUILT BY THE COMPILE AND NOT AGAIN HERE, §11. This step ran
      # `relational --build` after `build.py` had already made the store, which REPLACED it with one
      # compiled from `data/build` rather than from the run's own rows, and a store compiled that way
      # carried no `run_report`: the artefact this workflow publishes then told the site nothing
      # about the feed's window, the site's build emitted no feed files, and the files it was serving
      # were deleted as stale. The live site rendered nothing.
      #
      # WHAT THE STEP WAS FOR IS NOW WHERE IT BELONGS. It existed when the store was optional, to
      # make the schema refuse what the checks only reported; `build.py` builds the store as part of
      # the compile now, `--unattended` quarantining is what §1a gave it, and a delta it cannot apply
      # is rebuilt rather than fatal.

      - name: Invariants and budgets (runtime — reports, does not block)
        run: python3 check.py --runtime

      # THE LEDGER, AND A PROOF THE SITE'S DOCUMENT CAN BE BUILT FROM THIS STORE.
      #
      # `adapters/ledger.py` compares this run's captures against the last one and writes the
      # difference into the store, where `status.from_store` reads it. It runs after the compile
      # because the compile is what makes the store.
      #
      # `adapters/status.py` NO LONGER READS THREE JSON FILES TO WRITE A FOURTH, §13. It opens the
      # store and calls `from_store`, which is the same call the site makes to build its status
      # page. Running it here answers the question the site would otherwise be the first to ask:
      # whether the store about to be published can produce that document. `data/build/status.json`
      # is what a person reads without a browser.
      - name: The ledger and the status page's data
        run: |
          python3 adapters/ledger.py
          python3 adapters/status.py

      # THE ONE CODE-TIER PROOF THIS RUN STILL NEEDS, and the reason it is not the others (B3).
      # A canary is planted in a context built from TODAY'S corpus, so this asks whether the checks
      # can still fail against the data that just arrived. A check goes vacuous when the data
      # changes shape under it, which is a fault the check-in gate cannot see because the corpus it
      # runs against is yesterday's. `0 vacuous` is the property, and this is where it is at risk.
      - name: Prove the checks can fail against today's corpus
        run: python3 check.py --self-test

      # THE UNIT TESTS ARE GONE FROM HERE, and that is B3's answer rather than an omission. This
      # job fetches data; it does not change code. `./test.py` and `--canary` prove the code in the
      # tree is sound, the tree is the one `gate.yml` already blocked on at check-in, and nothing
      # between then and now can have altered it. Running them again asked a question whose answer
      # was settled, for four minutes a night, and answered it in a job where a failure stops the
      # data being published — so a flake in a test about credit splitting could withhold a day of
      # releases that were fetched perfectly well.
      #
      # WHAT COVERS THE CODE INSTEAD: `gate.yml`, on every push, blocking, with the site cloned and
      # the corpus built first so the suites have what they read.

      # A MOVED SELECTOR IS SILENT OTHERWISE. A platform that renames a class does not error: it
      # returns the right number of well-formed rows with the same field missing from every one.
      # The rules and their thresholds are in `adapters/fieldaudit.py`, with a test, because a rule
      # deciding whether a day's capture may be published is not a thing to keep in a YAML block.
      #
      # IT READ `data/build/feed.json` AND STORE-PLAN §13 STOPPED WRITING IT, so the run died here
      # on the tripwire refusing to answer rather than on a platform losing a field. The audit asks
      # the store, which is where the rows are.
      - name: Field audit — a moved selector is silent otherwise
        run: python3 adapters/fieldaudit.py

      # No content scan on this path. The guard's content half looks for real-name strings, and
      # nothing that reaches here can contain one: data/source, data/build, data/coverage and
      # data/ledger hold titles, authors, chapter names, dates and URLs scraped from public sites.
      # Checked rather than assumed — zero files under any of the four contain the local username
      # or a home path, and the only matches anywhere in the tree are the canaries planted inside
      # the guard scripts. The public repo receives only the three data/build JSON files, so a slip
      # would have to survive into those specifically.
      #
      # What IS worth asserting is authorship. A push authenticated with GITHUB_TOKEN does not
      # trigger `on: push` workflows, and a fresh CI checkout has no core.hooksPath, so neither
      # half of the guard runs automatically here. That does not matter for content. It would
      # matter if a future edit made the run commit as github.actor instead of the bot.
      - name: Assert the commit identity
        env:
          LEAK_DENY: ${{ secrets.LEAK_DENY }}
        run: |
          chmod +x .githooks/leak-guard.sh
          # THE IDENTITY THE GUARD ALLOWS, exactly. .githooks/leak-guard.sh holds a single
          # permitted author string and treats anything else as a violation — that single value is
          # the whole design, so CI matches it rather than the allowlist being widened to admit a
          # second one. The workflow had set "yurarium-bot <noreply@yurarium.github.io>" since it
          # was written and no run had ever reached this step to disagree.
          git config user.name  "Yurarium"
          git config user.email "311755991+yurarium@users.noreply.github.com"
          .githooks/leak-guard.sh identity-config

      - name: Commit the sources and the build
        run: |
          # data/build IS NOT COMMITTED. It is derived from the three directories beside it, and
          # the site repository's kari/data history already holds the exact bytes readers were
          # served, which is the published snapshot. Committing it stored the same information
          # twice and gave the two somewhere to disagree.
          # data/names IS COMMITTED, and has to be. The name passes below Compile write into it,
          # and a store rebuilt every run and never kept is a store that starts empty every run:
          # the work of naming what arrived today would be repeated tomorrow and nothing would
          # accumulate. It is a source in the same sense data/source is, journal-backed and
          # hand-curated in data/names/curated.yaml, which is the file a person edits.
          # `data/queue` IS COMMITTED, AND IT WAS NOT. The discovery queue carries a candidate
          # forward until something admits it, which means nothing on a runner that starts from
          # the committed tree: every candidate older than 百合ナビ's feed window would be lost on
          # the next run, which is the fault the carry-forward exists to stop. `shopquery` writes
          # here too and its rows were surviving only because a person ran it locally and pushed.
          git add data/source data/coverage data/ledger data/names data/queue
          git diff --cached --quiet || git commit -m "update: run ${{ github.run_id }}"

      - name: Push
        run: git push

      # SAVED WHETHER OR NOT THE JOB PASSED, which is the whole point of splitting the step. It
      # sits after the work that fills the cache and before nothing in particular; `if: always()`
      # is what makes a failed compile cost one run's fetching instead of two.
      - name: Save fetches and rendered DOMs
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache
          key: fetch-${{ github.run_id }}

      # ── WHAT THIS REPOSITORY PUBLISHES, §11 ───────────────────────────────────────────────
      #
      # A FILE WITH A VERSION ON IT, and nothing else. This workflow used to clone the site with a
      # deploy key, run `deploy.sh`, write HTML into it and rewrite its `index.html` to bust a
      # cache. All of that is the site's own business now: it builds what it serves from the store
      # this step publishes, on its own schedule, and this repository has no path that names it.
      #
      # A RELEASE ASSET RATHER THAN A COMMIT. 30 MB of binary per run would be a gigabyte of git
      # history a year, and a release asset never enters it at all. `GITHUB_TOKEN` is enough
      # because the release is on this repository; no cross-repository credential exists any more.
      - name: Publish the store
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 adapters/relational/__init__.py --publish corpus.sqlite
          TAG="store-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" corpus.sqlite \
            --title "$TAG" \
            --notes "The compiled corpus. Schema and format carry no guarantee; a consumer reads \
          \`store_stamp\` and refuses what it does not know."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # A CONSUMER IS TOLD, AND THIS FILE DOES NOT KNOW WHICH ONE. The mechanism is here and the
      # subscriber is repository configuration: `CONSUMER_REPO` and `CONSUMER_WORKFLOW` are Actions
      # variables and `CONSUMER_TOKEN` an Actions secret, none of them in the tree. Nothing in this
      # repository names the site, and a second consumer or none at all is a settings change rather
      # than a commit. WITH NOTHING CONFIGURED THIS STEP DOES NOT RUN, which is the state it is
      # committed in.
      #
      # SCOPE THE TOKEN TO `Actions: write` ON THE ONE REPOSITORY. `workflow_dispatch` is the
      # narrowest endpoint that starts a run; `repository_dispatch` would want `Contents: write`,
      # and a token that can start a build should not also be a token that can rewrite the site.
      #
      # A FAILURE HERE WARNS AND DOES NOT FAIL THE RUN. The store is already published and a
      # consumer that also polls will find it within its own period, so a token that expired
      # overnight costs latency rather than the update. The annotation is what stops that decaying
      # into a notification nobody notices has stopped arriving.
      - name: Tell a consumer the store has moved
        if: ${{ vars.CONSUMER_REPO != '' && vars.CONSUMER_WORKFLOW != '' }}
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_TOKEN }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          gh workflow run "${{ vars.CONSUMER_WORKFLOW }}" \
            --repo "${{ vars.CONSUMER_REPO }}" --field release="$TAG" \
          || echo "::warning::the consumer at ${{ vars.CONSUMER_REPO }} was not reachable; \
          $TAG is published and its own schedule will find it"

      - name: Stage A failed, and the data was published first
        if: ${{ steps.stage_a.outcome == 'failure' }}
        run: |
          echo "::error::Stage A reported a failing adapter. The build, the checks and the publish"
          echo "::error::all ran on the sources that were fetched, so nothing a reader holds is"
          echo "::error::missing; one or more platforms simply were not read tonight. The adapter"
          echo "::error::and its stderr are named in the Stage A step above."
          exit 1
