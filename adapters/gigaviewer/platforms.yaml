# Investigated 2026-08-01, not usable by this adapter:
#
#   comic-fuz.com    COMIC FUZ (芳文社) — publisher of つぼみ and the きらら line, so a real gap.
#                    Not GigaViewer. No /atom, no /rss, no robots.txt, /tag/ 404s. Custom SPA;
#                    needs its own adapter.
#   seiga.nicovideo.jp  ニコニコ静画 — / and /robots.txt both return 403 to non-browser clients;
#                    /manga and manga.nicovideo.jp respond. Unreadable robots.txt is a reason for
#                    caution, not a licence. Needs deliberate investigation before any fetching.
#   comic-walker.com カドコミ (KADOKAWA) — tag search results load from /api/, which its robots.txt
#                    disallows. The page's own __NEXT_DATA__ carries only genre and label lists.
#                    Label and ranking pages may be server-rendered; not yet checked.
