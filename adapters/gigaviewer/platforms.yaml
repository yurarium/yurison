# GigaViewer platforms (Hatena's manga engine). One adapter serves all of them: identical Atom
# feeds at /atom and identical series-page markup, so adding a publisher is a row here, not code.
#
# Tier B — publisher-operated, attesting (REQUIREMENTS §1).
# `yuri_genre` / `yuri_label` are the publisher's OWN labelling, so a match establishes
# marketing_label under DEFINITIONS §4. A third-party tag never would.

platforms:
  - id: ichicomi
    name: 一迅プラス
    publisher: 一迅社
    host: ichicomi.com
    atom: https://ichicomi.com/atom
    # Series listings whose entries are known to be the yuri line.
    series_pages:
      - url: https://ichicomi.com/series/yurihime
        label: コミック百合姫
    mode: genre
    yuri_genre: 百合
    verified: 2026-08-01

  # ── known-works platforms ───────────────────────────────────────────────────────────────────
  # Classic GigaViewer: server-rendered listings carrying title, author and tagline and NO genre
  # data. Verified 2026-08-01 that none exposes a working /tag/ or /genre/ page either — 
  # mangacross.jp/tag/百合 returns its homepage. These platforms cannot say which of their series
  # are yuri, so their feeds attest releases for works identified elsewhere (mode: known-works).
  - id: kuragebunch
    name: くらげバンチ
    publisher: 新潮社
    host: kuragebunch.com
    atom: https://kuragebunch.com/atom
    mode: known-works
    yuri_genre: 百合
    verified: 2026-08-01

  - id: comic-zenon
    name: コミックゼノン
    publisher: コアミックス
    host: comic-zenon.com
    atom: https://comic-zenon.com/atom
    mode: known-works
    yuri_genre: 百合
    verified: 2026-08-01

  # mangacross.jp/atom returns HTTP 200 but serves its React app shell, not an Atom feed. Its
  # /tag/百合 likewise 200s while returning the homepage. Disabled until a real feed is found.
  - id: mangacross
    name: マンガクロス
    publisher: 秋田書店
    host: mangacross.jp
    atom: https://mangacross.jp/atom
    mode: known-works
    enabled: false
    yuri_genre: 百合
    verified: 2026-08-01
    note: /atom serves HTML with a 200 status; no usable feed

  - id: comic-days
    name: コミックDAYS
    publisher: 講談社
    host: comic-days.com
    atom: https://comic-days.com/atom
