    mode: known-works
    yuri_genre: 百合
    verified: 2026-08-01
    note: >-
      GigaViewer (classic markup, no genre chips). Overlap 0.02 — the lowest measured, so its 65
      listed works are genuinely its own and its exclusivity will not shrink as others onboard.

  - id: comic-action
