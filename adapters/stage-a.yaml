  # The episode lists. `releases.py` above writes update dates, which make a feed row and never a
  # work row, so a serialisation reachable only here was invisible as a work however often it
  # updated. This writes the record type build.py turns into a row.
  #
  # THREE WORKLISTS, because a work reaches us by more than one route. For a long time there was
  # one, `serialisation-joins.yaml`, and every ニコニコ entry in it is a work already tied to a
  # printed record: a work the discovery sweep found had nothing to be joined from, so its episode
  # list was never requested. 見える子ちゃん has a full episode list on its page, free at the start
  # and the end with the middle behind the app, and the corpus held a release row for it and no
  # work page at all. 53 works were in that state. WORKS-PLAN section 3.
  #
  # THE THIRD IS THE ONE THAT CLOSES IT. Both adapters read the same page, one for its dates and
  # one for its episodes, so a work whose update this project recorded is a work whose episode list
  # it can ask for. The coverage yardstick is a sample of eight pages and left 36 behind on its own.
  # 337 targets became 383 with the yardstick and 492 with the file releases.py writes.
  - id: nicovideo-works
    optional: true
    argv: [adapters/nicovideo/works.py, --ids, data/queue/serialisation-joins.yaml,
           data/coverage/webcomics-gap.yaml, data/source/nicovideo/nicovideo.yaml,
           --out, data/source/nicovideo, --cache, "{CACHE}/nico-works"]

  # ASK THE SHOP WHETHER IT STOCKS A WORK, rather than waiting for its 百合 shelf to name one.
  # Every shop route this project has is shelf-driven: `recon/bookwalker_shelf.py` opens by saying
  # it reads "BOOK☆WALKER's 百合 shelf, read as a candidate list", so the question asked of a shop
  # is which works it FILES under 百合 and never whether it sells a given one. A shop that stocks a
  # book and files it as horror is then indistinguishable from a shop that does not stock it:
  # 見える子ちゃん has print editions on コミックシーモア and BOOK☆WALKER, is tagged 百合 by
  # Web漫画アンテナ in our own coverage file, and the corpus held a record from neither shop.
  #
  # THE PASS ALREADY EXISTED AND NOTHING RAN IT, which is exactly section 1's fault one layer out.
  # It has asked 639 works and found 174 with a creator agreement, and it resumes from its own
  # output, so a scheduled run picks up whatever the last one did not reach. 560 rows hold a web
  # serialisation and no print record at all, which is the population to ask about rather than the
  # size of the gap: many web serials have no book. WORKS-PLAN section 6.
  #
  # STOCK IS NOT A GENRE CLAIM. These works were admitted before the shop was asked, and what the
  # shop answers is what it sells; `by_shop_query` records the label as `none`, which DEFINITIONS
  # section 4 means as saying nothing about content.
  #
  # IT READS THE PREVIOUS BUILD'S series.json, because Stage A runs before Compile. A work admitted
  # today is therefore asked about tomorrow, which costs nothing here: the pass resumes from its own
  # output and has hundreds of works still to reach, so a day's lag on the newest one changes no
  # answer. The name passes are in Stage E for the opposite reason, since a name is wanted for the
  # work that arrived in the same run.
  # `shopquery` IS NOT HERE, and where it went is worth saying. It asks what the PUBLISHED database
  # is missing, which is `data/build/series.json`'s answer, and no compile has written that when this
  # stage runs: on a fresh runner it died on a missing file every single time, and on a developer's
  # machine it read whatever the last build left. It runs after the compile now, where its question
  # can be asked.

  # THE DATE AN ISBN IS A KEY TO. `volumes with an isbn and no date` is a ZERO budget, and a volume
  # holding an ISBN and no date is a lookup nobody has done rather than a fact nobody holds. The
  # shop query above brings in printed works, so it brings in ISBNs, and one arrived undated the
  # first time it ran. This pass is the one that closes that and it was not wired either, which
  # makes three passes found on 2026-08-13 that existed and had no caller. WORKS-PLAN section 6.
  - id: openbd
    optional: true
    argv: [adapters/openbd/enrich.py, --works, data/source/madb, --out, data/source/openbd,
           --madb-cache, "{CACHE}/madb-cache/1.2.18", --fetch, --retrieved, "{R}"]

  - id: webpages
    optional: true
    # THE FULL CANDIDATE LIST, NOT THE GAP, and the adapter's own docstring has said so all along:
    # "the gap deliberately excludes everything already reachable, so an adapter reading it loses
    # works the moment they are". Onboarding ヤングアニマルWeb is exactly that trap — its seven
    # works are in the gap only until this reads them once, and then the platform would go quiet
    # with nothing saying why. `--limit` is what bounds the fetching, per site.
    argv: [adapters/webpages/releases.py, --gap, data/coverage/webcomics-works.yaml,
           --out, data/source/webpages, --cache, "{CACHE}/webpages", --retrieved, "{R}"]

  # `--rendered skip` KEEPS THIS STAGE BROWSER-FREE, which is what the stage says it is. The
  # platforms that build their chapter list in the client are read in stage C, where a browser is
  # confirmed to exist and a slow pass is allowed to fail without costing the run.
  - id: generic
    optional: true
    argv: [adapters/generic/releases.py, --works, data/coverage/webcomics-works.yaml,
           --extract, data/coverage/extract.yaml, --rendered, skip,
           --out, data/source/webpages, --cache, "{CACHE}/generic", --retrieved, "{R}"]

  # RESTORED 2026-08-10 together with its section of render-targets.yaml, which 544a462 dropped.
  # From that commit until this one the adapter exited "no ganganonline section" before reading a
  # page, on every run, and a step that cannot succeed teaches a reader to skim the failure list.
  - id: ganganonline
    optional: true
    argv: [adapters/ganganonline/releases.py, --targets, data/coverage/render-targets.yaml,
           --out, data/source/webpages, --retrieved, "{R}"]

  - id: yomonga
    optional: true
    argv: [adapters/yomonga/releases.py, --works, adapters/yomonga/works.yaml,
           --out, data/source/webpages, --retrieved, "{R}"]

  - id: shogakukan
    optional: true
    argv: [adapters/shogakukan/releases.py, --sites, adapters/shogakukan/sites.yaml,
           --out, data/source/webpages, --retrieved, "{R}"]

  # マガポケ publishes a feed per series holding the whole run, so the ten-episode free window the
  # page draws is no longer what we capture. One request per series, targets read from the work
  # URLs the other adapters have already written, so a newly discovered work is picked up here
  # without this list changing.
  - id: magapoke-feeds
    optional: true
    argv: [adapters/magapoke.py, chapters, --out, data/source/webpages/magapoke-feeds.yaml,
           --retrieved, "{R}"]

