# Stage A: feeds, APIs and server-rendered markup. No browser.
#
# Declared here rather than inline in the workflow so the list is readable, diffable, and runnable
# by hand in exactly the form CI uses. run_stage.py executes these CONCURRENTLY.
#
# The safety argument for concurrency is that these adapters address DIFFERENT HOSTS. Politeness is
# owed to a server, and each adapter still walks its own host serially at its own pause, so no
# publisher sees traffic any faster than when the whole stage ran end to end. What stops is the 27
# platforms and 11 adapters waiting on each other for no one's benefit.
#
# `optional: true` means a non-zero exit is reported and tolerated, which is what `|| true` did in
# the shell. A failing adapter must not cost the run, and must not be silent either.
commands:
  - id: gigaviewer-platform-feeds
    optional: true
    argv: [adapters/gigaviewer/releases.py, --platforms, adapters/gigaviewer/platforms.yaml,
           --out, data/source/gigaviewer, --cache, "{CACHE}/giga", --retrieved, "{R}"]

  # Per-series feeds, which are where a work's own address comes from. A platform-wide feed states
  # a CHAPTER address, and `identity.stable_url` cannot reduce a GigaViewer one to the work, so a
  # work reached only that way looks new on every publication. The per-series feed states
  # `/atom/series/<id>`, which does not move, and its records are `web_work_chapters`, which is the
  # record type `build.py` turns into a work row.
  #
  # THE OLD NOTE HERE SAID THE OTHER PLATFORMS "EXIT IMMEDIATELY AND ALWAYS HAVE", and that was
  # true only of the form it was written in. Without `--candidates` a platform must declare
  # `series_pages` to have anything to walk, which in practice is ichicomi alone; WITH it the pass
  # takes its targets from the list every other adapter already reads. Run by hand against
  # となりのヤングジャンプ on 2026-09-02 it resolved 87 series and wrote 39 work records, on a file
  # that had not moved since 2026-08-02.
  #
  # WHAT THE STALENESS COST. Eighteen of the nineteen per-series files were frozen at the start of
  # August, so every work first served on those platforms since then reached the feed as releases
  # and never became a work: eleven of them today, which `updates naming a work we do not hold`
  # counts. Each is `optional`, so a platform that fails costs its own records and not the night.
  - id: gigaviewer-series-feeds
    optional: true
    argv: [adapters/gigaviewer/series_feeds.py, --platform, ichicomi,
           --out, data/source/gigaviewer, --cache, "{CACHE}/giga-series", --retrieved, "{R}"]

