# The print intake, weekly: the two retailer 百合 shelves, what they admit, the volumes each shop
# lists for the admitted works, and their entry into data/source. docs/LAUNCH-PLAN.md section 2.
#
# Built in August by hand, once, and read by the build ever since: no new volume reached the print
# side from either shop after 2026-08-05. In order, because each step reads what the one before it
# wrote, and weekly, because a shop adds volumes a few times a month and a capped pass works
# through the backlog over several weeks. A shop that is down costs that week and is recorded as a
# failed source like any other; what each file already holds stays.
#
# The national bibliography's monthly release is fetched here too, and the MADB routes read it
# after the shops: each route asks it about ISBNs or titles one of the captures above states, so
# it runs on what this week's captures hold.
#
# The National Diet Library is not here. Its search API is under a path its robots.txt disallows,
# which the project takes literally (adapters/names/ndl_reading.py), so the NDL passes stay frozen
# until the owner decides otherwise.
sequential: true
commands:
  - id: bookwalker-shelf
    optional: true
    every_days: 7
    argv: [adapters/recon/bookwalker_shelf.py, --refresh]

  - id: cmoa-shelf
    optional: true
    every_days: 7
    argv: [adapters/cmoa_shelf.py, --cache, "{CACHE}/cmoa-shelf"]

  # The publisher's own 百合 label as a third shelf: KADOKAWA works カドコミ tags and serves no
  # episode of, matched to the BOOK☆WALKER listing that sells them (adapters/labelshelf.py).
  - id: kadokomi-label
    optional: true
    every_days: 7
    argv: [adapters/labelshelf.py]

  - id: shelfingest
    optional: true
    every_days: 7
    argv: [adapters/shelfingest.py]

  # New admissions first, then every unfinished series not listed in four weeks, oldest first.
  - id: bookwalker-volumes
    optional: true
    every_days: 7
    argv: [adapters/recon/bookwalker_volumes.py, --revisit, --follow-series, --max-fetches, "400"]

  - id: bwingest
    optional: true
    every_days: 7
    argv: [adapters/bwingest.py]

  # New admissions only, for now: unlike the BOOK☆WALKER capture it does not yet list a held work
  # again, so a new volume of a work it already holds is not picked up.
  - id: cmoa-volumes
    optional: true
    every_days: 7
    argv: [adapters/cmoa_volumes.py, --limit, "200"]

  # ── the national bibliography ─────────────────────────────────────────────────────────────────
  # Each route below reads {CACHE}/madb-cache/current and the tag from there, so a record states
  # the release it was read from. The release itself is fetched in Stage 0 (adapters/stage-0.yaml).

  # The 百合姫 imprints, then the publisher texts a person found, then the ISBNs the shops and the
  # platforms state, then the shop query, in that order: each route leaves alone a work an earlier
  # one holds, and the imprint is the strongest evidence any of them carries.
  - id: madb-imprint
    optional: true
    every_days: 7
    argv: [adapters/madb/extract.py, --cache, "{CACHE}/madb-cache/current", --out, data/source/madb]

  - id: madb-publisher-text
    optional: true
    every_days: 7
    argv: [adapters/madb/by_publisher_text.py, --cache, "{CACHE}/madb-cache/current"]

  - id: madb-isbn
    optional: true
    every_days: 7
    argv: [adapters/madb/by_isbn.py, --cache, "{CACHE}/madb-cache/current",
           --capture, data/queue/cmoa-volumes.yaml]

  - id: madb-platform-isbn
    optional: true
    every_days: 7
    argv: [adapters/madb/by_platform_isbn.py, --cache, "{CACHE}/madb-cache/current"]

  - id: madb-shop-query
    optional: true
    every_days: 7
    argv: [adapters/madb/by_shop_query.py, --cache, "{CACHE}/madb-cache/current"]

  # Dates for BOOK☆WALKER rows the shop leaves undated, joined on a title and a person.
  - id: madb-title
    optional: true
    every_days: 7
    argv: [adapters/madb/by_title.py, --cache, "{CACHE}/madb-cache/current"]
