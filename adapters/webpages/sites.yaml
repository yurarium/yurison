# Server-rendered work pages, for platforms with no feed (REQUIREMENTS §5, §6).
#
# Selectors are declarative data so adding a platform is a row here, not code — and so a maintenance
# pass after a site redesign is a bounded edit. Each site declares how to find episode blocks and
# how to read a title, date and access state out of one.
#
# None of these platforms applies a 百合 tag, so nothing here establishes marketing_label
# (DEFINITIONS §4). Works are named by the Tier C yardsticks; the platform attests the chapters.

sites:
  # ビッコミ and 竹コミ run the same engine (comici) with identical markup — one spec, two
  # publishers. Verified 2026-08-01.
  - id: bigcomics
    name: ビッコミ
    publisher: 小学館
    host: bigcomics.jp
    engine: comici
    min_episodes: 1

  - id: takecomic
    name: 竹コミ
    publisher: 竹書房
    host: takecomic.jp
    engine: comici
    min_episodes: 1

  # championcross.jp — NOT mangacross.jp. Its /atom is an app shell, but the work pages run the
  # same comici engine as ビッコミ and 竹コミ.
  - id: championcross
    name: チャンピオンクロス
    publisher: 秋田書店
    host: championcross.jp
    engine: comici
    min_episodes: 1

  - id: kimicomi
    name: キミコミ
    # キルタイムコミュニケーション, not 一迅社. Every collected volume this platform's works carry
    # is a KTC line (ヴァルキリーコミックス, シャイニーコミックス, ヤングアンリアルコミックス) and
    # none is a 一迅社 imprint. The field was wrong from the first capture, and it is the one that
    # would have shown whose web arm this is when the imprints raised the question.
    publisher: キルタイムコミュニケーション
    host: kimicomi.com
    engine: comici
    min_episodes: 1

  - id: yanmaga
    name: ヤンマガWeb
    publisher: 講談社
    host: yanmaga.jp
    engine: yanmaga
    min_episodes: 1

  # ── added 2026-08-01 from the long-tail survey ───────────────────────────────────────────────
  # Four more comici installs, found by a second reconnaissance pass that tried the extraction
  # instead of sniffing for date-shaped strings. All four key on the same series-eplist markup as
  # ビッコミ, and needed no code. The first pass missed them because it probed five hosts for
  # comici markers and none of those five were comici — the sample decided the answer.
  #
  # `publisher` is left unset where the survey did not establish it: naming one from the domain
  # would be invented attribution.
  - id: g-comi
    name: Gコミ
    host: g-comi.jp
    engine: comici
    min_episodes: 1
    exclusive_works_at_onboarding: 11
    verified: 2026-08-01

  - id: hanayume
    name: 花とゆめ+
    # The antenna writes it with a full-width ＋ and the site with a half-width +. Without the
    # alias the same platform appeared as two, and a work carried once looked cross-published.
    aliases: ["花とゆめ＋"]
    publisher: 白泉社
    host: hanayume.com
    engine: comici
    min_episodes: 1
    # One of its four candidate URLs resolves to a series page here; the other three point
    # elsewhere. The parser demonstrably works on the one that does, so the redesign-detection
    # floor is set to match rather than discarding the site.
    min_works: 1
    exclusive_works_at_onboarding: 4
    verified: 2026-08-01

  - id: comicride
    name: ライコミ
    host: comicride.jp
    engine: comici
    min_episodes: 1
    exclusive_works_at_onboarding: 3
    verified: 2026-08-01

  - id: j-nbooks
    name: COMICリュエル
    host: comic.j-nbooks.jp
    engine: comici
    min_episodes: 1
    exclusive_works_at_onboarding: 1
    verified: 2026-08-01

  # ヤングチャンピオン's own site, same comici engine as チャンピオンクロス and a DIFFERENT host.
  # Found because the comparator's チャンピオンクロス claims carry youngchampion.jp URLs — the
  # publisher runs both and the antenna files them under one name.
  - id: youngchampion
    name: ヤングチャンピオン
    publisher: 秋田書店
    host: youngchampion.jp
    engine: comici
    min_episodes: 1
    min_works: 1
    verified: 2026-08-01

  # アサコミ — 朝日新聞出版, opened 2025-01-30, and the successor to ソノラマ+ whose content it
  # absorbed. Our candidates still point at sonorama.asahi.com, which no longer resolves; that
  # was recorded as "host gone" when it had in fact moved. comici engine, so no code needed —
  # what it needs is re-resolved work URLs.
  - id: asacomi
    name: アサコミ
    publisher: 朝日新聞出版
    host: asacomi.jp
    engine: comici
    min_episodes: 1
    min_works: 1
    supersedes: sonorama.asahi.com
    verified: 2026-08-01

  # HERO'S Web — comici. It answered 503 to every probe while it was down for maintenance, which
  # was recorded as "unreachable"; it is neither blocked nor gone, and the works are on the bare
  # host rather than the viewer. subdomain the candidate list carries.
  - id: heros-web
    name: HERO'S Web
    publisher: ヒーローズ
    host: heros-web.com
    engine: comici
    min_episodes: 1
    min_works: 1
    verified: 2026-08-02

  # コミックノヴァ — 一二三書房's own web arm. It was being read by the generic heuristic pass,
  # which cannot see this platform's chapter labels: the page names each instalment in a
  # span.story-num and the label is not always numbered. プリンセ「ス」's only instalment is
  # labelled 特別掲載, so the heuristic found nothing chapter-shaped, fell below its floor of two
  # and dropped a real work; 猫魔法 came through with a chapter reconstructed out of a promo box.
  # Reading the element the platform itself names as the label answers both.
  #
  # `min_episodes: 1` because a 特別掲載 is one instalment and that is the whole work. The floor
  # of two belongs to heuristic extraction, where one dated thing on a page is usually the volume;
  # a label read from the platform's own element is not a guess and owes no corroboration.
  - id: comicnova
    name: コミックノヴァ
    publisher: 一二三書房
    host: www.123hon.com
    engine: comicnova
    min_episodes: 1
    min_works: 1
    verified: 2026-08-04

engines:
  comici:
    block: '(?=<div data-e2e="eli" class="series-eplist-item")'
    title: 'data-e2e="eliTitle">([^<]+)<'
    date: 'series-eplist-item-meta-date">(\d{4})/(\d{1,2})/(\d{1,2})<'
    url: 'href="(/episodes/[^"]+)"'
    # comici DOES state per-episode access in the listing — a 無料 badge or a coin price. An
    # earlier note here said it did not; that was wrong, from grepping the wrong offset.
    # Verified 2026-08-01 against 竹コミ and confirmed on all four comici sites.
    # The badge is rendered two ways across comici installs. 竹コミ classes it
    # (…access-text … mode-free); 花とゆめ+ puts the literal 無料 inside the access element and an
    # SVG lock icon on the paid ones. Matching only the first left half of hanayume's chapters with
    # no access at all, so both forms are accepted.
    free: 'series-eplist-item-access-text[^"]*mode-free|series-eplist-item-access[^>]*>\s*(?:<[^>]*>\s*)*無料'
    paid: 'series-eplist-item-access-paid|series-eplist-item-access[^>]*>\s*(?:<[^>]*>\s*)*<path'

  comicnova:
    block: '(?=<span class="story-num">)'
    # The date is required by the TITLE selector rather than checked afterwards, because this
    # platform withdraws instalments in place: 猫魔法's 第2話 through 第12話 keep their labels and
    # replace the date with 公開は終了しました。 A row with no date is not a dated release, and
    # emitting one would put eleven undated chapters into a release feed.
    title: '<span class="story-num">([^<]*)</span>[\s　]*(?=\d{4}年\d{1,2}月\d{1,2}日更新)'
    date: '(\d{4})年(\d{1,2})月(\d{1,2})日更新'
    url: 'class="btn"><a href="([^"]+)"'

  yanmaga:
    block: '(?=<li class="mod-episode-item")'
    title: 'data-episode-title="([^"]+)"'
    date: 'class="mod-episode-date">(\d{4})/(\d{1,2})/(\d{1,2})<'
    url: 'class="mod-episode-link[^"]*"[^>]*href="([^"]+)"'
    free_attr: 'data-is-free="(true|false)"'

# Investigated 2026-08-01, not usable by this adapter:
#
#   pixivコミック   comic.pixiv.net — Next.js client shell; a work page is 31KB with 13 Japanese
#                  runs and no embedded payload. Needs a different approach. 55 works.
#   マガポケ        pocket.shonenmagazine.com — Nuxt; the p-episode__ classes appear only in CSS,
#                  with content in a hydration payload rather than markup. 36 works.
#   ニコニコ漫画     manga.nicovideo.jp — /atom returns text/html with a 200 (app shell). Also a
#                  syndicator with poor image quality, so low value regardless. See
#                  data/platforms.yaml.
