  【今日の10ページ】世界の終わりにエロ本と先生と。:
    verdict: 'oneshot'
    basis: 'MAGCOMIはこの話をコンテンツID 10p_ で始まる番号のもとに置き、作品ページ自身が「今日の10ページ」を10ページの短編を載せるコーナーだと説明している。MAGCOMIで2話以上ある作品のコンテンツIDは作品ごとのスラッグで、10p_ では始まらない。したがってこの接頭辞は話数の数え上げではなく、プラットフォームがこの作品をその枠に置いたという事実である。'
    basis_en: 'MAGCOMI files this episode under a content id beginning 10p_, and the work''s own page describes 今日の10ページ as a slot for ten-page short manga. MAGCOMI works holding two or more chapters carry a per-work slug instead and never that prefix, so the prefix is the platform placing the piece in that slot and not a tally of episodes.'
    source_kind: 'platform'
    reviewed: '2026-08-08'
    source_url: 'https://magcomi.com/episode/2550689798372256224'
