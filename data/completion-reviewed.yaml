  ベリアル:
    verdict: 'oneshot'
    basis: 'カドコミの作品ページに「読切」バッジが付いている（2026-08-08取得）。このバッジは話数の数え上げではない。1話しか配信されていないカドコミ作品のうち、瑠璃の宝石・ハクメイとミコチ・ぷれいめ～との3件は同じ場所に「連載」と表示され、残りに「読切」が出る。話数名も「カドマンGP受賞作」で、受賞作を一本掲載したものである。'
    basis_en: 'カドコミ prints a 読切 badge on the work''s own page, read 2026-08-08. The badge is not arithmetic on the episode count: of the カドコミ works holding a single episode, three carry 連載 in the same place (瑠璃の宝石, ハクメイとミコチ, ぷれいめ～と), so the platform is stating what the work is. Its only episode is named カドマンGP受賞作, a prize entry.'
    source_kind: 'platform'
    reviewed: '2026-08-08'
