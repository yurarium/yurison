# A claim is a listing site saying a work updated. Where it names a URL, a reader could simply
# open it, and so can we: adapters/remaining/ tries the per-series Atom feed an episode page
# links, then comici markup, then a plain parse, then a rendered DOM. Several of these hosts
# are GigaViewer installs whose PLATFORM-WIDE feed returned nothing for our candidates — but the
# PER-SERIES feed is a different endpoint and answers for exactly the work we hold a URL for.
