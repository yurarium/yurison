# Collections, and why their label must not descend to their instalments.
#
# A 百合アンソロジー, a 短編集 and an author's 読切シリーズ are all CONTAINERS. Each instalment is a
# separate short work by a separate author. 一迅プラス states both in the chapter title —
# 【試し読み】白玉もち［貝合わせ］ is 貝合わせ by 白玉もち — and we were flattening nineteen of these
# into "new chapters" of one series by an author called アンソロジー.
#
# THE HAZARD, which is the reason this file exists:
#
#   Discovery flags a container because ONE instalment matched. Recording the container as a yuri
#   work with N chapters asserts that about all N, and that is not knowable from the container.
#
# The seven below are safe in one direction only: they are TITLED 百合アンソロジー, so the publisher
# has labelled the collection itself. That is a statement about the collection, and it is still not
# a statement that every instalment is yuri — an anthology can carry a framing piece, an afterword
# comic, or a contributor who read the brief differently.
#
# 横槍メンゴ新作読切シリーズ on ヤンジャン+ is the unsafe shape and is NOT recorded as a work: it is an
# author's 読切 series where Vol.1 is described as 女性×女性 and Vol.2 carries no such description.
# Nothing about Vol.1 licenses a claim about Vol.2.
#
# What is done about it: instalments are split out under their own author and title, the collection
# is shown as context rather than as the work, and no genre label is inherited downward. Classifying
# an instalment remains what it always was — a human judgement (DEFINITIONS §4).
