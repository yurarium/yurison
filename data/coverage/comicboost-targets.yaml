# comicブースト series pages to read.
#
# comicブースト is 幻冬舎コミックス's own web magazine, so the tags on a series page are the
# publisher's own and count as a marketing label under DEFINITIONS §4. It runs a 百合 tag and
# applies it to 21 of its 161 series; three of those we already hold. The rest are here, along
# with works the page labels in its own words rather than with the tag.
#
# あぶくの姉妹 is deliberately absent. It carries no platform label and the case for it rests on
# reading a sisters premise as in scope, which is our inference rather than the publisher's
# word, and this file is for the ones where somebody else has said it.
#
# Several of these are 百合作品集 whose chapters all carry one date. That is the 出張掲載
# signature, so their dates cannot become a latest, and some may turn out to be print
# collections the platform led us to rather than web serialisations.
source: comic-boost
role: capture-targets
