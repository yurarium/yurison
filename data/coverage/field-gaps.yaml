# Fields still missing, with the reason, regenerated from the build.
#
# EVERY ATTESTED ROW NAMES ITS CHAPTER, and all but 22 carry an author and an access state too.
# Unconfirmed claims carry none of these BY NATURE: a listing site said a work updated, no more.
#
# Counting fields is not the same as reading the list, and the difference is not small. Every
# check here passed on 43 rows whose WORK NAME was a fragment of Atom XML, on chapters called
# 1, 2, 3 whose real names sat unread in a subtitle field, and on a chapter with マガポケ welded to
# its title by an undecoded &#x2F;. All were populated. All were wrong, and all were obvious on
# sight. The audit below is the weaker of the two checks; the list is the other one.
