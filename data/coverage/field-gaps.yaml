  マンガワン: 'No work page exists — /manga/<id> 404s for every title, including ones that are running. The
    serialisation list, the search results and the reader all show title and date only. The one place
    a name appears is the purchase card of a locked chapter, between the chapter title and 消費アイテム: for
    メイド＆ロイド that is ちいさなひとひら, which reads as plausibly a chapter subtitle as a pen name. One observation
    of an ambiguous slot is not an author, so it is not recorded as one.'
  マガポケ: 'Five older chapters whose access the platform no longer shows: the work page renders ten chapters
    and the rest need a control this fetch cannot press, and the episode pages are JavaScript shells.
    Their authors and dates are complete; only the access badge is out of reach.'
  マイナビニュース: A news site carrying a manga column. The series URL 301-redirects to carfairy_re, which lists
    general motoring articles rather than the column's own instalments, and no article, meta tag or JSON-LD
    on it names an author.
