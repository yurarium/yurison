#                sits in the author's position on the purchase card and which I nearly recorded.
#   マガポケ      The work page shows twenty chapters and hides the rest behind もっと見る. Pressed
#                it. Also a third badge, --ticket-free (作品チケット), that adapters/render/ could
#                not even capture, because it matched the class with (\w+) and '-' is not a word
#                character — so the state meaning 'readable now' was being recorded as purchase.
#   マイナビニュース  Not a gap. The three rows were sidebar articles — a bike-oil column and a quiz —
#                scraped off the series page and filed under this work with heuristic dates. The
#                column itself ended at No. 70 on 2024-01-01. Withdrawn; see withdrawn-sources.
#   コロコロ      The author boundary is unguessable from the title string and stated exactly by
#                the page's /author/N links. SWAV is a third author, not a subtitle.
