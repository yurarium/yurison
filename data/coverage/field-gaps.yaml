reasons:
  マンガワン: No work page exists — /manga/<id> 404s for every title, running ones included. The serialisation
    list, the search results and the reader show title and date only. A name appears in exactly one place,
    the purchase card of a locked chapter, and for メイド＆ロイド that name is ちいさなひとひら — as plausibly a chapter
    subtitle as a pen name. One observation of an ambiguous slot is not an author and is not recorded
    as one.
  マガポケ: 'Five older chapters whose access the platform no longer shows: the work page renders ten chapters
    and the rest need a control this fetch cannot press, and the episode pages are JavaScript shells.
    Their authors, chapters and dates are complete.'
  マイナビニュース: A news site carrying a manga column. The series URL 301-redirects to carfairy_re, which lists
    general motoring articles rather than the column's own instalments, and no article, meta tag or JSON-LD
    on it names an author.
