#
# overlap = share of this platform's listed works that also appear on another platform.
#
# IMPORTANT: overlap does NOT establish direction. A high-overlap platform may be syndicating
# others' work, or may be originating work that others syndicate — this data cannot tell them
# apart. What it does measure is UNIQUE CONTRIBUTION: a high-overlap platform adds little that
# is not obtainable elsewhere, whichever way the syndication runs. That is what matters for
# onboarding priority, so direction is left unasserted.
#
