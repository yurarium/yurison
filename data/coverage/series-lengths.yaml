# How long a platform says a series is, where the platform says it and we hold less.
#
# A count is not a chapter list, and this is not one: there are no titles and no dates here. What
# it does is stop a partial capture being published as a complete series, which is how
# ベイビー車中ハッカーズ came to say "2 chapters, complete, dormant since October 2024" about a work
# that is at its nineteenth instalment.
#
# `holds_last` records whether the newest chapter WE hold is the newest the platform lists. It is
# what separates a capture that is short from a capture that is behind. マガポケ's records are short
# and not behind: we hold ten of 将来的に死んでくれ's 42 episodes and the one we call newest is the
# 42nd, so its dates are right and only its count is wrong.
#
# `episodes_stated` counts rows in the platform's own list, the unit our `chapters` also counts, so
# the two are comparable. `instalments_stated` counts numbered instalments, which a platform may
# split across several rows; it is recorded where that is all the platform numbers, and build.py
# does not read it. Do not promote one to the other. 冷たくて 柔らか's fifteen instalments are
# somewhere over thirty rows, and 15 published against a capture of 5 rows would be a made-up
# number in the wrong unit.
#
# WHAT EACH PLATFORM SAYS, checked 2026-08-04 against a page per platform:
#
#   マンガワン        全23話 above the chapter list, on every series page. Paginated ten rows at a
#                    time and the total covers all pages, including 先読 rows released early to
#                    paying readers and PR rows.
#   コロコロオンライン  全102チャプター above the chapter list.
#   pixivコミック      no total, but the list enumerates the whole run: withdrawn episodes stay in
#                    it as ranges reading 第４話〜第６７話 掲載期間が終了しました. Where every row
#                    is a numbered 第N話 and the expanded numbering runs 1..N with no gaps, the
#                    count is read; where the run is numbered any other way it is not. The rows a
#                    reader can open are exactly the chapters we hold, on all 23 works checked,
#                    so the first row being one of ours is what settles `holds_last`.
#   ガンガンONLINE     nothing. `__NEXT_DATA__` carries a `chapters` array holding the readable
#                    window and no count: 裏世界ピクニック, at 第90話, gives nine rows.
#   サンデーうぇぶり    nothing. The episode page carries no list and no count, and the series feed
#                    holds only what is readable now.
#   コミックDAYS       nothing on the page, but /atom/series/<id> is the whole run rather than a
#                    window, so there is nothing to state: サタノファニ's 337 entries are the 337
#                    chapters we hold.
