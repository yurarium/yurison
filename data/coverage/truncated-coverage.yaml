# comici coverage was truncated. It is now followed to the end — and one thing I claimed about
# it was wrong.
#
# WHAT IS TRUE: comici renders ten episodes and hides the rest behind もっと見る. It also renders
# a range navigation — /episodes/<hash>/1, /2, /3 labelled 1, 31, 61 — and those are ordinary
# URLs returning the whole block, not a page of ten. Following them takes
# お姉さんは女子小学生に興味があります。 from 22 chapters to 76. The LAST range holds the newest
# chapters, which is the only part an update feed needs. No browser and no credential: the
# episode list also comes from plus-api.comici.jp, which answers 403 without a contentApiKey
# Bearer token from the site's own bundle, and that is a client credential this project does not
# replay. The range links are the site's own navigation and need nothing.
#
# WHAT I GOT WRONG: I wrote that the 竹コミ claims 'were right for nine months' and that we had
# been reading too shallow to see it. Following the ranges disproves it — the last range for
# お姉さんは女子小学生に興味があります。 ends at 64話 dated 2025-10-17, exactly what we already held,
# against a claim of 2026-07-21. The platform does not support the claim. I had inferred that
# from the truncation rather than checking it, which is the same fault as reading a missing
# field as a paid one.
#
# A REAL ISSUE THIS EXPOSED: 竹コミ and アサコミ date whole back-catalogues to one day — every one
# of アサコミ's 26 episodes reads 2026-04-15, every one of 竹コミ's 64 reads 2025-10-17. Those are
# migration dates, not publication dates, and no amount of fetching makes them per-chapter. It
# is why claims against these platforms cannot be corroborated by date at all.
