# What was decided about every pair of credits sharing one reading.
#
# 84 readings answer for 168 credits in feed/names.json, and a shared reading is evidence and never
# proof. The last two arrived with the re-extraction of 2026-08-08, on one MADB creator field
# holding two names followed by their two readings. `shape` is what the two spellings are to each
# other, computed by `credit_identity.relation`, and it PROPOSES: a whole-string script change and
# a name beside its own reading in kana are things a SOURCE does, so they say one credit was
# recorded twice. A partial script flip and two unrelated spellings are not, so they say nothing
# and the pair stays two credits.
#
# The shape does not decide, because it cannot see the works and the publishers around a pair. On the
# 13 pairs where it could not settle the question the basis says what did.
#
# `merge` retires the losing identifier where one was minted and attaches the second spelling where
# none was, which are the two halves of the distinction adapters/identity.py draws. `keep` records
# that the pair was examined and left as two credits, which is what DEFINITIONS §9 does for a
# work a rebuttal upheld. `not-a-credit` is for a pair that is neither.
#
# `withdraw` is the odd one out and names ONE spelling. Every decision above settles two spellings
# that share a reading; this settles a string that was never a credit and that holds a published
# identifier, so it has no second spelling and no `keep`. It names `to`, the live credit a reader
# who followed the dead address should land on, and the anchor is detached rather than lent, so
# nothing in the registry ends up saying the withdrawn string is another way of writing a person.
#
# Read by adapters/credit_identity.py. A pair this file does not name is counted by the budget
# `credits sharing a reading nobody has ruled on`, so a newly sourced reading that puts two credits
# together arrives as a number that has risen.
