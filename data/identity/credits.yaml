    credit: "大沢やよい"
    anchors:
      - "credit:大沢やよい"
      - "credit:オオサワヤヨイ"
    attached:
      - anchor: "credit:オオサワヤヨイ"
        basis: "オオサワヤヨイ is the whole of that reading written in kana, and it credits no work of its own. A source states both forms in one credit field, `大沢やよい / オオサワヤヨイ`, where the slash is also what separates two people, so the store kept each half as a credit of its own. `credits.dedupe` already keeps the second form out of the credit a reader is shown. 大沢やよい credits 22 work(s), among them ハロー、メランコリック！. Nothing was minted for the second spelling, so it is attached to the identifier the first holds and any later run that meets it in a credit field resolves to the same address."
        retrieved: 2026-08-08
