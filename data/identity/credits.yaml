# Credits sharing one reading that were examined and KEPT APART. Recorded so the
# question is not re-derived at every capture and so the reasoning is not lost each
# time, which is what DEFINITIONS §9 does for a work a rebuttal examined and upheld.
# A relation is not a merge: two credits a source filed differently on different works
# are two objects, and saying they may be one person is information hung beside them.
homophones:
  - reading: "アオイ"
    credits:
      - id: c01679
        credit: "蒼井"
      - id: c02155
        credit: "青い"
    shape: "unrelated"
    basis: "Two spellings with no character in common. 蒼井 is a surname and 青い is the adjective for blue, and the reading they share is what まんが王国 files 蒼井 under and what a morphological analyser assembled for 青い. Both reach us through 百合コレ and credit different works. Nothing here says one artist chose both."
  - reading: "アカガワサガン"
    credits:
      - id: c01305
        credit: "赤川左岸"
      - id: null
        credit: "赤河左岸"
    shape: "unrelated"
    basis: "川 against 河 in the same position. 赤川左岸 credits ホテル・ローレルの渡り鳥たち at KADOKAWA and its reading is an analyser guess; 赤河左岸 comes from a BOOK☆WALKER edition, credits no work in the corpus, and MADB states its reading on M1094980. One of the two is likely a mis-keyed character and the evidence points at the corpus spelling being wrong, which is a question for the naming pass and not for identity. Neither is merged into the other, and 赤河左岸 holds no identifier today, so nothing is lost by waiting for a source."
  - reading: "アキラ"
    credits:
      - id: c02148
        credit: "アキラ"
      - id: c02035
        credit: "日明"
    shape: "kana-reading"
    basis: "アキラ is the whole of 日明’s reading, which would ordinarily settle it, and here it does not. アキラ is among the commonest given names in Japanese and stands as a complete pen name on its own; both credits reach us through 百合コレ, a self-publishing line carrying 496 works, so sharing it is not agreement about anything. Each credits one work and nothing else connects 夏の光と山の闇 to 自重して！南さん. Two artists read アキラ on one aggregator is the ordinary case, so the pair stays two credits and the relation is recorded instead."
  - reading: "カボチャ"
    credits:
      - id: c01517
        credit: "かぼちゃ"
      - id: c00751
        credit: "カボちゃ"
    shape: "partial-script-flip"
    basis: "かぼちゃ and カボちゃ agree on the sound and differ in WHICH characters are katakana: カボ is katakana and ちゃ stays hiragana. A source converting a name converts all of it, so no transcription produces this, and a pen name built on the contrast is exactly what it looks like. かぼちゃ is one contributor to 一迅社’s Citrusコミックアンソロジー and カボちゃ credits 2 works at 道玄坂書房. A shared reading is evidence and not proof, and this is the case the evidence does not carry."
  - reading: "シマ"
    credits:
      - id: c00541
        credit: "島"
      - id: c01667
        credit: "志真"
    shape: "unrelated"
    basis: "島 and 志真 share a reading and no character. 島 credits ぽかぽかたいわん！ at KADOKAWA with a reading NDL states; 志真 credits 6 works through シマテイエン, its own circle. Different kanji and different houses, so the pair stays two credits."
  - reading: "スドウユミ"
    credits:
      - id: c01459
        credit: "須藤佑実"
      - id: c01685
        credit: "須藤祐美"
    shape: "unrelated"
    basis: "The kanji differ, 佑実 against 祐美, which no transcription rule produces. What is on the other side is real: both credits are girls×garden comics books from ジーオーティー, and both sit in the Avalon anthology line, 須藤佑実 on four of its volumes and 須藤祐美 on AVALON. That is the shape of one artist mis-keyed at one source, and 須藤祐美’s reading is an analyser guess while 須藤佑実’s is one まんが王国 prints. It is still a claim about which characters the artist writes their name with, and no source we hold states that the two are one person. The pair is recorded as sharing a reading and a line, and it is the first one a source check should settle."
  - reading: "タキ"
    credits:
      - id: c01253
        credit: "多㐂"
      - id: c02150
        credit: "瀧"
    shape: "unrelated"
    basis: "多㐂 and 瀧 share a reading and nothing else. 㐂 is the variant of 喜 that reads キ, so 多㐂 reads タキ by the characters; 瀧 reads タキ as an ordinary surname. One credits a 一迅社 book and the other a 百合コレ one. Two names that sound alike."
