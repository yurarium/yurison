    attached:
      - anchor: "credit:イワシタケイ"
        basis: "イワシタケイ is the whole of that reading written in kana, and it credits no work of its own. A source states both forms in one credit field, `岩下継 / イワシタケイ`, where the slash is also what separates two people, so the store kept each half as a credit of its own. `credits.dedupe` already keeps the second form out of the credit a reader is shown. 岩下継 credits 6 work(s), among them 仕事の後は恋しよう. Nothing was minted for the second spelling, so it is attached to the identifier the first holds and any later run that meets it in a credit field resolves to the same address."
        retrieved: 2026-08-08
