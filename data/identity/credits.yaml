  - id: c02015
    credit: "お子様ランチ"
    merged_into: c01136
    merge_basis: "One coinage written two ways. お子様ランチ is the phrase for a children’s set meal and おこさまランチ is the same phrase in kana, which is what a source does to a name and not what an artist does to one. Both spellings sit in multi-contributor anthology credits, 宙出版’s 終電逃したOLさん pair under the kana and 少年画報社’s トランススイッチ under the kanji, which is where an editor retypes a contributor list. The houses differ and the name does not: a joke pen name this specific is not one two artists arrive at separately. おこさまランチ survives because it credits the larger share of the works."
    anchors:
      - "credit:お子様ランチ"
