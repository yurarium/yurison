    merge_basis: "One character differs in script and nothing else does: ぺパ子 against ペパ子, with 毒田 and 子 identical. Every kana in the one spelling is katakana in the other, which is a transcription and not a style, since ぺ and ペ are indistinguishable at a glance and no stylised name is built on a contrast nobody can see. 毒田ペパ子 credits 4 works across 一迅社 and マッグガーデン and survives; 毒田ぺパ子 credits 或いは、私の名探偵 at KADOKAWA."
