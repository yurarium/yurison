# Related works. A relation and not a merge: whether a one-shot beside a
# serialisation is a distinct work, an instalment the run absorbed, or a story a
# later chapter retells differs case by case, and relating them says what the
# evidence supports. Continuations belong here too, citrus and citrus+ among them.
