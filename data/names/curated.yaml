# Hand-reviewed English names. NAMES-PLAN §5.
#
# Applied by adapters/names/curate.py, which refuses anything it cannot attribute: `licensed` needs
# a licensor's own catalogue page, `official-jp` needs the Japanese publisher or the platform, and
# a community-editable database can supply a candidate but never a name.
#
# `translated` and `romaji` are ours and carry no page, because they are judgements rather than
# findings. The reasoning goes in `note`, so a later reviewer can disagree with the argument rather
# than only with the result.

titles:

  # --- attributed to a licensor -------------------------------------------------------------

  安達としまむら:
    en: Adachi and Shimamura
    basis: licensed
    source: Yen Press
    source_kind: licensor
    source_url: https://yenpress.com/series/adachi-and-shimamura-manga
    reviewed: '2026-08-03'
    note: >-
      Yen Press publishes the Yuzuhara Moke manga; Seven Seas publishes Iruma Hitoma's light
      novels. Both use the same English title, so the split does not affect the string, but the
      catalogued work here is the manga and the manga's licensor is the one cited.

  裏世界ピクニック:
    en: Otherside Picnic
    basis: licensed
    source: Square Enix Manga & Books
    source_kind: licensor
    source_url: https://squareenixmangaandbooks.square-enix-games.com/en-us/series/otherside-picnic
    reviewed: '2026-08-03'
    note: >-
      Square Enix publishes the Mizuno Eita manga; J-Novel Club publishes Miyazawa Iori's novels.
      Cited to the manga's licensor for the same reason as 安達としまむら.

  # --- ours ---------------------------------------------------------------------------------

  うさぎはかく語りき:
    en: Thus Spoke the Rabbit
    basis: translated
    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      かく語りき is the phrasing of ツァラトゥストラはかく語りき, so the English carries the
      allusion by matching the formula the same book is known by in English. うさぎ is the animal
      rather than a character: the platform synopsis has 人喰いうさぎ infesting the underground and
      a rabbit-eared girl beside the protagonist.

  ワインガールズ:
    en: Wine Girls
    basis: translated
    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      Katakana English throughout, so the English is recovery rather than interpretation. The
      synopsis confirms the wine reading over any homophone: the cast are grape varieties.

  江口さんちの純情サキュバス:
    en: The Eguchi Household's Innocent Succubus
    basis: translated
    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      さんち is さんの家, the household rather than the person, which the English keeps. 純情 is
      innocent in the sense of chaste, and that is the joke the title is making: the synopsis has a
      succubus who cannot work out what ero is.

  運命は役に立たない:
    en: Fate Is No Help
    basis: translated
    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      Replaces a stored romanisation. 役に立たない is useless in the sense of serving no purpose,
      and the premise is a world where everyone is issued a red thread of fate that does not help
      the protagonist at all, so the flatter English reads truer than Fate Is Useless.

  星屑テレパス:
    en: Stardust Telepath
    basis: translated
    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      星屑 is stardust and テレパス is telepath, so the obvious rendering is also the one English
      readers know from the anime's release. Held briefly as a candidate while looking for an
      attribution; there is none, because nothing on the Japanese side renders the title in Latin
      script and the manga is unlicensed. Ours, and marked as ours.

