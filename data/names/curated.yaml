    note: >-
      進んでる is advanced in the sense of ahead of everyone else, which the synopsis confirms:
      Tia was exiled as a heretic for how she uses a saint's magic.

  自動車の妖精 パッソちゃんの恩返し:
    en: Passo the Car Fairy Returns the Favour
    basis: translated
    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      恩返し is the folktale move, as in 鶴の恩返し, where the creature repays a kindness. パッソ
      is a Toyota model, so the fairy is named after the car she is.

  狼の皮をかぶった羊姫:
