    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      ゆりゆり is a coinage and stays. The subtitle is fandom slang (尊い) inside a police blotter
      frame (事案が発生しています), and the joke is the collision, so the English keeps the
      bureaucratic register rather than smoothing it.

  イジめてイジられて:
    en: Bullying and Being Bullied
    basis: translated
    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      Active and passive of the same verb, which English can only do with a participle pair. Not
      teasing: the synopsis says 嫌がらせ, and the relationship it becomes is 同意の上のイジメ愛.

  カムパネルラの塔:
    en: Campanella's Tower
    basis: translated
    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      カムパネルラ is Miyazawa Kenji's spelling of the name in 銀河鉄道の夜, where Campanella is
      the boy who does not come back. The story is two fashion models and one of them is ill, so
      the allusion is load-bearing and the English keeps the name in its familiar form.

  ニニンがシノブ伝ぷらす:
    en: Ninin ga Shinobuden Plus
    basis: translated
    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      The title is the times table: 二二が四 read ni-ni ga shi, with 四 swapped for シノブ伝.
      Nothing in English does that, and a rendering that dropped it would be a different joke.
      Romanised rather than translated, except that ぷらす is spelt Plus because it is the English
      word and Purasu would be a romanisation of a loan. Filed as translated for that reason: basis
      romaji means render from the kana, which would produce Purasu and discard this string.

  フルボイス！:
    en: Full Voice!
    basis: translated
    source: yurarium
    source_kind: derived
