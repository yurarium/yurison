  球詠:
    reading: タマヨミ
    reading_basis: stated
    source: comic-fuz
    source_kind: platform
    source_url: https://comic-fuz.com/manga/441
    reviewed: '2026-08-03'
    note: >-
      Reads as ball and song, and is also the two leads' names: 山崎珠姫 and 武田詠深. Either
      translation would discard the other, so it stays romanised.

      Corrected as a READING rather than as an English string. The analyser had 詠 as エイ, giving
      Tamaei, and the store held Tamayomi as an `en` beside it, which the interface ignores: basis
      romaji means render from the kana, so the style toggle would otherwise silently do nothing.
      Fixing the reading fixes the romanisation in all three styles, the furigana and the search
      index at once. Houbunsha's own platform states the reading in a yomi field.

  私を喰べたい、ひとでなし:
    en: This Monster Wants to Eat Me
    basis: translated
    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      ひとでなし is what you call a person who has behaved monstrously, and the joke is that she
      is one. Monster is the English word that does the same double duty: you monster is something
      said to people, so the literal reading arrives second, which is the order the title wants.
      An earlier draft read The Inhuman Girl Who Wants to Eat Me, which had the sense and not the
      voice, because inhuman in English is literary where ひとでなし is something shouted.
      The Japanese addresses her (私を喰べたい、ひとでなし is a vocative, not a sentence) and this
      does not; the register is worth more than the grammar here.

  聖女先生の魔法は進んでる！:
