      Replaces a stored romanisation.

  この湯で、あなたと:
    en: In This Bathhouse, With You
    basis: translated
    source: yurarium
    source_kind: derived
    reviewed: '2026-08-03'
    note: >-
      湯 is the water rather than the building, and the Japanese is intimate about it, but the
      setting is a 銭湯 and an English bath is a private tub. Bathhouse buys the setting at the
