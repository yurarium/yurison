# One imprint line per entry, holding every spelling the corpus records for it.
#
# WHY THIS FILE EXISTS. A book line reaches us through three catalogues that transcribe it
# differently, and the corpus stored each transcription as though it were a line of its own.
# 一迅社's single yuri line arrived as 27 strings. Built over that, a publisher page would have
# given one line twenty entries. `adapters/names/imprints.py` reads this file and is the only
# producer of "which line is this string"; the module's docstring carries the matching rule and
# what it deliberately refuses to do.
#
# WHAT A SPELLING IS. A string a record carries, written here as a reader would see it. The module
# compares folded (NFKC, lowercased, spaces and hyphens and 中黒 removed), so one entry covers
# `Yuri-hime comics`, `Yurihime comics`, `YURIHIME COMICS` and `Yuri-Hime COMICS`. A compound
# statement needs no entry: `IDコミックス. Yurihime comics` is split on the cataloguer's separators
# and matched on its most specific segment.
#
# EXACT ON A SEGMENT, NEVER A SUBSTRING, which is the rule this file depends on. `百合姫コミックス`
# has 10 sibling lines under 一迅社 and a substring match eats ZERO-SUMコミックス, HOWLコミックス
# and DNAメディアコミックス, none of which is a yuri line. `Yuri-hime comics anthology series` is
# listed in full for the same reason: it must not be reached by the entry above it.
#
# `name` IS WHAT A READER IS SHOWN and carries where it came from. Where the publisher states its
# own list of labels, that spelling wins even when the corpus mostly holds another; where nobody
# states one, the corpus's own most-recorded spelling is used and `name_basis` says so. Names are
# written NFKC-normalised, because full-width Latin inside a Japanese name is the source's
# typesetting and the interface folds it anyway.
#
# `parent` IS RECORDED AND NOT MERGED AWAY. ISBD's ". " states a series inside a series, and the
# outer element is real: IDコミックス is 一迅社's general comics umbrella and carries 47 rows of
# this corpus that make no yuri claim at all. Naming the parent keeps that visible; folding a
# sub-line into it, or it into a sub-line, would lose the one distinction a publisher page is for.
#
# `publishers` MAY HOLD MORE THAN ONE COMPANY SPELLING. 角川コミックス・エース is catalogued under
# KADOKAWA on 37 rows and under 角川書店 on one, because the house was renamed and the older
# records were not. Matching is scoped to these, so a line can never be reached from another house.
lines:

  # ── 一迅社 ───────────────────────────────────────────────────────────────────────────────────
  #
  # THE HOUSE THIS FILE WAS BUILT FOR. 27 strings, 8 lines, and one string left alone.
  - id: id-comics
    publishers: [一迅社]
    name: IDコミックス
    name_basis:
      source: 一迅社
      url: https://www.ichijinsha.co.jp/
      retrieved: 2026-08-08
      note: >-
        The umbrella every 一迅社 comic carries, and a line in its own right where a record states
        nothing more specific. Every one of the 47 rows holding it alone entered on a retailer's
        shelf and carries marketing_label none, so this is not the yuri line under another name.
    spellings:
      - IDコミックス

  - id: yurihime-comics
    publishers: [一迅社]
    name: 百合姫コミックス
    parent: IDコミックス
    name_basis:
      source: 一迅社
      url: https://www.ichijinsha.co.jp/yurihime/
      retrieved: 2026-08-08
      note: >-
        The publisher's own page for the magazine names the book line 百合姫コミックス, and
        BOOK☆WALKER's label list for the house gives the same spelling. MADB writes コミック百合姫
        in the same field from 2025, which is the MAGAZINE's name standing in for the book line;
        it is recorded below as a spelling and is not what the line is called.
    spellings:
      - 百合姫コミックス
      # The Latin logotype as it is printed on the book, in the two forms it has had. Both MADB and
      # openBD change from Yuri-hime to Yurihime at books published in 2015, and MADB modified all
      # of its pre-2025 records in one 2024 sweep that emitted both forms, so the change is the
      # publisher's and both catalogues transcribed it faithfully.
      - Yuri-hime comics
      # The abbreviation, running alongside the spelt-out form every year from 2015. Volumes of one
      # series carry both: C357075 holds YH comics, Yuri-hime comics, Yurihime comics and
      # yh comics across its own run.
      - YH comics
      # The magazine's name in the book line's field, on records from 2023 onward. MADB's own
      # `IDコミックス. Yurihime comics = コミック百合姫` states the two as one thing.
      - コミック百合姫
      # Listed in full so the entry above cannot reach it, and folded here because no publisher-side
      # source names an anthology label: BOOK☆WALKER's list of 21 一迅社 labels does not hold one.
      - Yuri-hime comics anthology series

  - id: yurihime-books
    publishers: [一迅社]
    name: 百合姫books
    name_basis:
      source: corpus
      note: >-
        Kept apart from 百合姫コミックス deliberately. It is the same 百合姫 brand in a different
        format, and merging a books line into a comics line would file whatever it holds under a
        label its own publisher did not use. One row, published 2007.
    spellings:
      - 百合姫books

  - id: zero-sum-comics
