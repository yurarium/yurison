note: 'Readings and English renderings, keyed by the exact Japanese string. NAMES-PLAN §8.1: the stored
  form is the KANA READING, never a romanised string — Yuri / Yuuri / Yuri are all derivable from kana
  and none is derivable from another, so baking one in would cap what the reader-facing style toggle can
  ever offer. `en` is present only where a source STATES a Latin form; otherwise it is absent and the
  rendering is generated from `reading` at display time. `basis` is about the English rendering (authors:
  stated|romaji; titles: official-jp|licensed|translated|romaji, in that precedence); `reading_basis`
  is about the kana. `en_candidates` holds English titles we have seen but cannot attribute to a Japanese
  publisher or a licensor: community databases also carry scanlation titles, which are not names the work
  has, so a candidate is never promoted to `en` without confirmation. Conflicts are kept, never resolved
  silently.'
role: name-readings/publishers
source: overlay
