- title: ゆりひめ@ピクシブ
  url: https://comic.pixiv.net/magazines/206
  kind: magazine-channel
  host: pixivコミック
  origin_magazine: コミック百合姫
  origin_publisher: 一迅社
  note: A syndication of コミック百合姫 onto pixivコミック carrying most or all of its works, not a work in its own
    right. Its updates are real — something in 百合姫 updated — but which work is not stated, so it cannot
    be reported as one. pixivコミック itself is closed to us by operator choice, so the individual works behind
    it are not reachable there either; they are covered through 一迅社's own channels instead.
no_chapter_dates:
- name: ガンガンONLINE
  host: www.ganganonline.com
  observed: 2026-08-01
  detail: 'Its __NEXT_DATA__ chapter objects carry id, status, thumbnailUrl, mainText, subText and an
    app launch URL — and mainText is "次回更新：8月6日", the date of the NEXT update. There is no publication
    date on any chapter, rendered or not. A reader on the site cannot see when a given chapter appeared
    either, so this is not something a better adapter reaches. What it does publish is forward-looking:
    which day the next instalment is due.'
