- id: nicovideo
  name: ニコニコ漫画
  en: Niconico Manga
  publisher: ドワンゴ
  reading_rank: 3
  aliases:
  - ニコニコ静画
  overlap: 0.71
  syndication: Largely but not solely a syndicator (project owner, 2026-08-01). It does originate some
    content, so it cannot be dismissed outright.
  former_blocker: 'WRONG, corrected 2026-08-01. It said: episode_item markup carries no per-episode date,
    so a release cannot be placed on a timeline, and reaching it would need one fetch per episode. The
    first half is true — episode items really do carry only data-number, a page count and view counters.
    The conclusion was not. The date is on the same page in div.meta_info, at work level: "2026年07月23日更新  2024年10月24日開始  [
    4話 無料 ]". Server-rendered, so a plain fetch reaches it, one per work like カドコミ and FUZ. The reasoning
    error worth remembering: the feed''s unit for an unattested update is "this work updated, on this
    date", which is what the comparators state and what the interface shows. Work level was always sufficient.
    Per-episode was a requirement I invented and then declared unmeetable. Checked before building: 百合ナビ
    claimed 魔女まじょS-WITCH updated 2026-07-23 and the page says 2026年07月23日更新.'
  granularity_caveat: Work level means no chapter title and no chapter number, so these releases carry
    type unclassified and cannot establish a chapter kind. "[ N話 無料 ]" states how many episodes are free,
    not that the newest is, so the free view only counts a work where every episode is.
  watched: true
  watched_since: 2026-08-01
  granularity: work
  notes: 'The main practical problem in the gap, and largely a mirage. Image quality is notably worse
    than the origin platforms, and it syndicates a great deal of content published elsewhere. Its 175
    listings reduce to 91 unreachable-elsewhere, and most of those 91 are expected to originate on platforms
    not yet watched rather than on ニコニコ itself.

    PREDICTION CONFIRMED (2026-08-01). Onboarding サンデーうぇぶり, webアクション and COMIC FUZ cut ニコニコ''s exclusive
    count from 91 to 76 without touching ニコニコ at all — its apparent coverage really is largely other platforms''
    work seen through it. pixivコミック fell 63 → 55 over the same period for the same reason.

    So ニコニコ is not a coverage target: onboarding origins erodes it for free. It is worth having only as
    a fallback source for works genuinely unavailable elsewhere, and it should never be a `preferred`
    source given the image quality.'
  host: manga.nicovideo.jp
- id: pixivcomic
  name: pixivコミック
  en: pixiv Comic
  publisher: ピクシブ
  reading_rank: 3
  overlap: 0.77
  watched: true
  watched_since: 2026-08-02
  adapter: adapters/render/
  adapter_note: 'RETIRED 2026-08-02 and finished 2026-08-10. adapters/pixivcomic/ read the
    /api/app/ endpoint named in `blocker` below, which answers a self-identifying client 403,
    so the route only works by pretending to be a browser and §5 rules that out. The revert
    moved its candidate list to ../pixiv-api-adapter-retired/ and left the code in the tree,
    where nothing ran it and build.py held a validation that hard-exits if its output ever
    appears beside the rendered file. The code is now beside its candidate list. pixivコミック
    is served by the rendered route, which is the browser the operator serves.'
  blocker: Reachable, but only with a browser in the pipeline. Work pages are a pure client shell (__NEXT_DATA__
    empty) and the data comes from /api/app/works/..., which returns 403 to a self-identifying non-browser
    request — so a plain fetch gets nothing, and spoofing the client to get past that is out under §5.
  reconnaissance_2026_08_01: 'Rendered comic.pixiv.net/works/12066 in a real browser. The page shows everything
    needed: title, author, the publisher''s own 百合 tag, per-episode availability (掲載期間が終了しました vs readable),
    and 更新日 at work level. No access control is being circumvented by this — a browser is the client the
    operator serves. What it costs is a rendering step in the pipeline for 131 works, on an ongoing basis.
    NOT DONE, deliberately: overlap is 0.77, the highest of any platform, so its unique contribution is
    the smallest of the large targets, and onboarding origin platforms erodes it without touching it.
    Worth revisiting only after ニコニコ lands and its exclusive count is re-measured.'
  notes: 'CORRECTED 2026-08-01: initially recorded as an origin platform on no evidence. Measured overlap
    is 0.77 — higher than ニコニコ漫画''s 0.71 — so most of what it lists is available elsewhere too. Direction
    unknown. Lower resolution as well, so its exclusive count should shrink as other platforms are onboarded.'
  host: comic.pixiv.net
