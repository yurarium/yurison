  - id: kirarabase
    name: きららベース
    publisher: 芳文社
    reading_rank: null
    watched: false
    notes: >-
      Not a site of its own — an official channel ON ニコニコ漫画
      (manga.nicovideo.jp/official/kirara/), which is why no domain resolved. Its 24 works are
      芳文社 きらら titles, so most should also be on COMIC FUZ; only 5 of 24 are in our FUZ set,
      because that set was antenna-seeded rather than taken from FUZ's own catalogue — and FUZ
      publishes no index, sitemap or robots.txt to enumerate from.
