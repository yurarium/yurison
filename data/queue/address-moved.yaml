# Works whose ROW ADDRESS moved, so the identifier they answer to would otherwise be lost.
#
# WHAT HAPPENED. `build.py` gives a row the address of its newest chapter, and a work carried on
# several platforms has several. Which platform supplies that address depends on which row wins
# `best`, and on 2026-08-07 the chapter-count rule changed and five works changed hands: their
# 一迅プラス and マガポケ chapters came to outnumber the コミックDAYS ones the anchor was taken
# from. `identity.py` then found no entry for the new address and minted a second identifier for a
# work it already held.
#
# THIS IS NOT A JOIN AND NOT A MERGE. Nothing new was discovered and nothing is retired. Each row
# below lists BOTH addresses among its own `sources` in one series row, so the two are two ways
# into one serialisation, and the work already answered to the older one. Attaching the newer
# address keeps that answer working whichever platform wins next time.
#
# THE UNDERLYING FAULT IS NOT FIXED HERE. A row's address is a chapter address on every
# GigaViewer platform, and a chapter address changes when the work publishes. This file repairs
# five instances; see docs/GAPS.md §21 for the shape.
#
# READ BY: `identity.py --attachments`.
