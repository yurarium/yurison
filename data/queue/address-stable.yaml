# Stable work-level addresses for rows anchored on a chapter.
#
# WHY. build.py gives a row the address of its newest chapter, so on every GigaViewer platform
# the address changes when the work publishes. identity.py anchors on that address, finds no
# entry for the new one, and mints a second identifier for a work it already holds. 535 rows
# were exposed; docs/GAPS.md §21 records the shape and data/queue/address-moved.yaml repaired
# five instances of it after the fact.
#
# WHAT THIS IS. The work-level address each of those rows already sits under, attached to the
# identifier the work ALREADY answers to. Nothing is joined, merged or retired: the chapter
# address keeps resolving and the stable one starts resolving, so the switch in build.py that
# follows cannot mint anything.
#
# READ BY: `identity.py --attachments`.
