# The work-level address for each comici row anchored on an episode.
#
# WHY. build.py gives a row the address of its newest chapter and identity.py anchors the work
# on it, so the row moves when the work publishes. comici writes an episode as
# /episodes/<hash>, which carries nothing of the work, so the address had to be fetched.
#
# WHAT THE EVIDENCE IS. The episode page links its own series, three times and once more as an
# rss variant, and that link is the platform placing the episode in a work. Read by
# adapters/comici.py:series_link, which ignores the platform's /series/list/ paging and the
# /store_items/series/ shop path sitting on the same page.
#
# The other 17 チャンピオンクロス rows already carry /series/<hash> and were never exposed.
#
# READ BY: identity.py --attachments.
