# Work-level addresses for the マンガワン rows whose chapter address is /viewer/<chapter id>.
#
# WHY THESE ARE NOT IN address-in-string.yaml. マンガワン writes a chapter two ways. The
# /manga/<work id>/chapter/<chapter id> form carries the work and identity.stable_url reduces
# it. The /viewer/<chapter id> form carries nothing, so the work id had to be fetched.
#
# WHAT THE EVIDENCE IS. /viewer/<chapter id> redirects, and the page it lands on states a
# canonical address of /manga/<work id>/chapter/<chapter id>. That is the platform naming the
# work this chapter belongs to. The work address /title/<work id> was then fetched and
# answered with the work's own title.
#
# READ BY: identity.py --attachments.
