# Rows the site published in August 2026 that no file now carries, and what to do about each.
#
# HOW THEY WERE LOST. `feed/current.json` is a 14-day window and a month file used to be written
# only once the month had ended, so a row published on 3 August sat in no served file from 17 August
# until September. The site carries forward the rows a published file holds; a row in no file has
# nothing to carry it. So when the store stopped stating one of these, it was erased from the record
# after a reader had already been shown it.
#
# THE PROCEDURE IS FIXED and this file is the residue. `emit.archived_months` publishes the month in
# progress from its first day, so every row now enters an archive the day it appears and the
# carry-forward covers it. Nothing new can join this list.
#
# WHY THIS IS A QUEUE AND NOT A RESTORE. 246 rows were lost and 105 of them are still published,
# under an id that changed when a platform slug or an address format did: `remaining` became
# `comic-zenon`, `corocoro` became `corocoro-online`. Restoring those would show a reader the same
# chapter twice, and seven of them would file a July chapter under August. The 141 below have no
# replacement at all, and they are not one class either. 44 dated 2026-08-13 are consecutive
# chapters of the same comic-fuz series, which is a back catalogue being read for the first time
# rather than six chapters published in one day; 25 sit in the 2026-08-07 bucket `build.py` itself
# flags as bulk re-dating. Restoring those would assert updates that did not happen, which is the
# opposite of what the register is for.
#
# SO EACH ROW NEEDS A READING: an update that happened and should be in August, or a first sighting
# of an older chapter that never was one. The rows are kept here because deciding is the slow half
# and losing the evidence while deciding is how this happened in the first place.
#
# WHERE THEY CAME FROM. The published `kari/data/feed/current.json` in the site repository's own
# history, every commit from 2026-08-01, taking each row's first appearance. Reproduce with the
# recovery described in docs/PLAN-feed-archives.md.
