# Volume histories for the BOOK☆WALKER rows of data/queue/admitted.yaml. NOT RECORDS.
#
# Keyed by `shop_id`, which is the series number or the volume uuid the admitted row already
# carries, so this joins back without matching titles. Still data/queue/: promotion into
# data/source/ needs the joins and a decision this file does not make.
#
# WHAT THE SHOP STATES.
#   delivered   配信開始日, the day BOOK☆WALKER began selling the file. Present on every volume.
#               It is a fact about the shop's stock and NOT a publication of the work: it runs
#               later than the print date on some rows and earlier on others, so it is not even a
#               consistent bound. It is never used as first_publication.
#   printed     底本発行日, the publication date of the print edition the file was made from. This
#               IS a publication of the work, and it is the only field here that answers
#               DEFINITIONS §6. Absent on digital-first imprints, which is most of this shelf.
#   isbn        Never stated, anywhere on this site. The shop sells files. openBD and NDL are both
#               keyed on ISBN, so neither is reachable from this shelf.
#
# WHAT first_publication_basis MEANS.
#   print-base-edition                 the earliest 底本発行日 across the work's volumes
#   shop-delivery-date-only            volumes were read and the shop stated no print date
#   no-date-stated                     volumes were read and the shop stated no date at all
#   chapter-serial-no-publication-date the work is sold by the chapter on the shop's 話・連載
#                                      store, which has no volumes and no print edition. Its one
#                                      date is 更新, the day the LATEST chapter went up, so it
#                                      answers §6 in the wrong direction and is kept apart under
#                                      `last_updated`.
#   no-volumes-found                   the series page listed nothing this pass could read
#
# EVEN print-base-edition IS THE VOLUME'S DATE AND NOT ALWAYS THE WORK'S. A serialised work was
# published in a magazine before its tankōbon and this shop never mentions the magazine. Whether a
# tankōbon date satisfies §6 for a serialised work is a decision for whoever promotes these rows.
#
# EXCLUSIONS ARE COUNTED AND NEVER NAMED, as in admitted.yaml. A volume page shows the volume's
# own title, imprint and publisher, any of which can carry a designation the series title did not.
# `excluded_last_pass` counts what THIS pass met. An excluded row keeps no identifier here, so it
# is not marked done and is met again next pass; withdrawing it belongs in admitted.yaml.

