# Works whose byline no shape in adapters/bylines.py reaches, settled by reading the page.
#
# THE DECISION LIVES HERE AND THE RECORD IS GENERATED, the same relation data/names/curated.yaml
# has to data/names. adapters/bylines.py merges these into data/source/webpages/bylines.yaml, so
# the source layer stays something a run produces rather than something a person types into.
#
# A HOST WITH THREE WORKS ON IT DOES NOT GET A PARSER. マンガワン states its artist nowhere but
# the tail of its own `<meta name="description">`, after the synopsis and a full stop. A rule
# taking the last run of characters is right on all three of ours and wrong the first time a
# synopsis ends on a character's name, and there is no fourth work here to test it against. So
# these were read rather than parsed, and each says which page was read.
#
# `author` is what the page states. `note` is why it can be believed and what else agrees.
# `unresolved` is for a work whose author no source states at all, which is a finding and not a
# gap in this file: it says the search was run and came back empty.
reviewed: 2026-08-06
works:
  - work_title: "プリンセ「ス」"
