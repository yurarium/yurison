# ── print works ─────────────────────────────────────────────────────────────────────────────
#
# Yuri anthologies. MADB and openBD both file them with an empty creator, because the publisher
# registered the book under no single author, and コミックシーモア files six of them under
# `アンソロジー`, which is the word "anthology" rather than a person. The contributors are on the
# publisher's own book page, and where the publisher no longer carries the book they are on the
# shop's, under a title the shop spells differently from MADB.
#
# WHAT IS RECORDED IS WHO DREW SOMETHING IN THE BOOK. A cover illustrator who contributed no
# story is not a contributor to the work and is left out; where the publisher lists the same
# person as cover artist AND contributor, they are in once, in the publisher's own order. The
# rule matters because it is applied nineteen times below and an inconsistent one would put
# 蔵王大志 beside eleven people whose manga is in the book and his is not.
