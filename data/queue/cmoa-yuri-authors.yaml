# CANDIDATE AUTHOR READINGS — names from data/queue/cmoa-yuri.yaml that data/names does not hold.
#
# WHY THESE ARE NOT IN data/names. They belong to works nobody has admitted. A reading recorded
# here is a finding about a name; recording it in the store would assert that the name is one this
# database carries, and 1,860 shelf rows are candidates rather than works. When a work is admitted,
# its author's entry moves across as a copy rather than as a fresh decision.
#
# THE FIELD SHAPE IS adapters/names/curate.py's, deliberately, so that move is mechanical:
# `reading_basis: stated` with `reading_source_kind: national-library` is what that module already
# demands of a reading the National Diet Library states. curate.py does not read this file.
#
# NOTHING HERE IS GUESSED. NDL OpenSearch `?creator=` is the route, reading
# `dcndl:creatorTranscription` beside `dc:creator`, and a name it does not attest is `unresolved`,
# which is a finding. A reading derived from the characters would be a guess wearing a label, and
# pen names are where that goes wrong: NDL's own transcription is kept even where it is not
# compositional, because pen names frequently are not.
#
# WHAT `status` MEANS, and the distinction matters to whoever resumes:
#   resolved       NDL states one reading and every record agrees.
#   unresolved / no-record     asked, and NDL holds no record under that exact name. Most of these
#                              artists publish on the web, so their work has no ISBN and no
#                              cataloguer has ever seen it. Silence is about NDL, not about them.
#   unresolved / conflicting   asked, and NDL's records disagree. One may be a different person.
#   unresolved / not-attempted NOT ASKED. This run was capped at 60 lookups.
#
# HOW THE 60 WERE CHOSEN. Descending by how many shelf titles the author has, among authors with
# at least one title from a publisher that is not a doujinshi distributor. That ordering buys the
# most works per resolved name and it also has much the best hit rate, since a book with an ISBN is
# the only kind of thing NDL holds. Resuming continues down the same order.
#
# ndlsearch.ndl.go.jp's HTML record pages were returning 503 throughout; the API answered normally.
# Requests went out as yurarium/0.1 (bibliographic database; +https://yurarium.github.io/) at 1.6s intervals.
#
# THE ROUTE IS CLOSED AS OF 2026-08-05, AND THE 842 UNATTEMPTED ROWS ARE STOPPED RATHER THAN
# OUTSTANDING. https://ndlsearch.ndl.go.jp/robots.txt lists `Disallow: /api` under `User-agent: *`,
# and the OpenSearch endpoint above is under /api. The 60 rows already attempted went out before
# anyone read that file. This project takes the same rule literally elsewhere: adapters/kadokomi/
# routes around a robots-disallowed /api/ at real cost, so resuming here is a decision for the
# project owner rather than the next run's default. What made it invisible is recorded in
# adapters/recon/probe.py: the robots parser cut its rule list to twelve entries and /api is the
# twenty-ninth, so the check that should have refused this route reported it permitted.
#
# THE PERMITTED ROUTE TO THE SAME FACT is adapters/names/openbd_reading.py, which reads the kana a
# publisher registered beside the author's name. It is keyed by ISBN and has no author search, so
# it reaches a name only through a book we hold an ISBN for. That is nobody on this shelf: these
# are the authors of works nobody has admitted, and the shelf capture carries no ISBNs.
