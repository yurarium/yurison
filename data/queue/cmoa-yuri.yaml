# CANDIDATE LIST — コミックシーモア's 百合・GL genre shelf, captured 2026-08-04.
#
# WHAT THIS IS. Every title the shop files under genre 37 (百合・GL), read from its own listing
# pages at https://www.cmoa.jp/search/genre/37/ . It is a record of what a retailer shelved, not a
# record of any work. data/queue/ sits outside the source tree so nothing here can become a record
# by accident, and build.py does not read it.
#
# WHAT IT IS NOT EVIDENCE OF. A retailer's shelf is a third party filing a work under 百合, which
# DEFINITIONS §4 makes evidence toward `content_tier` and never toward `marketing_label`. No entry
# here carries a marketing_label and none may be given one from this file. `label` below is a
# different thing: 雑誌・レーベル is the publisher's own imprint, which IS publisher-side evidence,
# and it is kept in its own field so the two never merge.
#
# HOW IT WAS TAKEN. Listing pages, 100 titles to a page, as
#   yurarium/0.1 (bibliographic database; +https://yurarium.github.io/)
# at least 1.6s apart. cmoa's robots.txt disallows account, basket and reader paths and none
# were touched. No cover image, no synopsis, nothing beyond the bibliographic fields.
#
# The publisher is NOT on a listing row. Rather than fetch 1869 work pages for one field, the
# shelf was re-read once per publisher through the shop's own publisher facet, 83 of them, whose
# counts sum to exactly the shelf total and each of which returned exactly the number it claimed.
# 1 work page was fetched, to establish that the work page carries the field at all, and
# one author page, to check that the -全年齢版- titles have adult twins in the same catalogue.
#
# EXCLUSIONS APPLIED, and the count is the only thing recorded about them. cmoa sells censored
# editions of adult works on this all-ages shelf: the same work, genitalia erased, filed 青年マンガ.
# Titles carrying such a marker are pornography under REQUIREMENTS and are excluded outright, so
# their titles appear in no file here.
#   R18版: 1 title(s) excluded
#   全年齢版: 4 title(s) excluded
#   白抜き修正: 4 title(s) excluded
#
# `doujin` says a doujinshi distributor is selling this, which is a fact about the seller rather
# than a judgement about the work. It is true only where adapters/cmoa.py has evidence, so `false`
# means "not on that list" and not "checked and found otherwise". That module names the publishers
# that read as indie or doujin distribution and were never established, and 完結 was verified there
# too: the shop's facet counts 1,050 and this capture marks 1,044 kept rows plus 6 excluded ones.
