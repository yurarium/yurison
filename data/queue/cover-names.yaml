# Names read off a platform's own artwork. CANDIDATES FOR CURATION, joined to nothing.
#
# WHERE THESE COME FROM. `adapters/artwork/covers.py` fetches a work's splash or cover into a cache
# beside the checkout, and a person reads it. The image is never committed and never referenced by
# the site (REQUIREMENTS §2); what is written down here is what the artwork SAYS, which is a fact
# about a title and is exactly what §2 says is safe to keep.
#
# WHY THE ARTWORK AND NOT THE MARKUP. Two things live only in the picture. A work's own Latin title
# is set into the logo and appears in no field on the page: ココロメイク コスメティカ prints
# `cocoromake ♥ cosmetica`, which no romanisation of the katakana would ever produce, because メイク
# is the English word `make`. And a title's furigana is printed over the kanji where nothing states
# a reading.
#
# NOTHING HERE IS A RECORD YET. Each row is a reading of an image by eye, with the address of the
# image so a second person can look at the same thing. Promoting one means writing it into
# data/names/curated.yaml with basis `official-jp`, whose bar is the Japanese publisher or the
# platform stating it, which is what a key visual is.
# ── WHAT THE FIRST FULL PASS FOUND, 2026-08-11 ────────────────────────────────────────────────
#
# 1,339 web works looked at, 1,205 splash images stored, 442 MB in the cache beside the checkout.
# Of the works examined by eye so far, nearly every key visual carried something: an official Latin
# title, a publisher's romanisation, an artist's own spelling of their name, or furigana over the
# logo. That rate is the argument for finishing the reading.
#
# WHERE IT COULD NOT REACH, AND HOW EACH WAS ANSWERED, 2026-08-12. Every one of the 134 refusals
# is now stored, by asking a route the platform itself offers rather than by pushing harder at the
# one that refused:
#
#   comic-fuz.com, 80 works. Answers 403 to this user agent on every request. Its `og:image` was
#   read in the Browser pane, same-origin and paced at 1.3 s, and the image CDN then served every
#   one of the 80 to an ordinary fetch. Only the PAGE refuses us; the pictures never did.
#
#   comic.pixiv.net, 39 works. Serves a shell that builds the page in JavaScript. Recovered with no
#   browser at all: `bylines.py` already calls that site's own catalogue endpoint, `works/v5/<id>`,
#   and it states an `image.main_big` which is the unresized original.
#
#   ganganonline 4, corocoro 2, flowercomics 1, ganma 1, all 403, all read the same way as
#   comic-fuz, and all four gave a real key visual: ガンガンONLINE's carries the Latin title
#   `Hikikomari the Vampire Countess Monmon` beside the logo, which is the thing this pass exists
#   to find.
#
#   manga-one, 6. Its work page is at `/manga/<series>/chapter/<id>`, and the bare `/manga/<id>`
#   answers page-not-found, which is why the first attempt stored six panel crops of about 8 KB:
#   the chapter address's own og:image is one frame of the comic. The page is drawn in JavaScript,
#   so the cover comes off the rendered DOM, the img whose src holds `title_list_single`, picked
#   out by an alt that is the work's own title. All six replaced.
#   The first of them opened glosses 妖怪殲滅 as ばけものごろし, the second gloss reading this pass
#   has turned up, so the six were worth going back for.
#
# ONE IS NOT A REFUSAL AND IS NOW SETTLED AS SUCH. 123hon.com answers, and its og:image contains
# `<?php echo $ContentsData[`, an unrendered template. `urljoin` made a URL of it that urlopen
# refused for holding control characters, and it surfaced as `unreachable`, which said the host had
# not answered when it had. `image_url` refuses a value carrying markup or a control character now,
# so it reads as a page stating no picture, which is what it is.

# A PLATFORM CAN STATE THE WRONG PICTURE. magazinepocket puts the EPISODE thumbnail in `og:image`,
# a crop of one panel with no logo on it, so its images are stored and worth nothing to this. That
# is not a fault to fix here; it is a platform naming a different thing by the same tag, and the
# only remedy is knowing which platforms are worth reading.

# ── HOW A FINDING IS DECIDED, ruled by the project owner 2026-08-12 ──────────────────────────
#
# ONE. A title the artwork sets in ALL CAPS is recorded in Initial Caps, unless live text on the
# page confirms the capitals. A logo shouts; that is typography and not the name. `decision:
# take-as-title` with `as_recorded` carrying the cased form, and `latin` left as the artwork has it
# so nobody has to take my word for what it said.
#
# TWO. A Latin form that is only the Japanese title TRANSLITERATED is not the title, and is not
# evidence about romanisation either: our own rules stand, and a publisher writing は as `ha` does
# not change them. `decision: not-a-title`, kept in full for the owner to review rather than
# dropped, because the reading it implies may still be worth something.
#
# THE SAME TWO QUESTIONS ARISE FOR A PERSON'S NAME and the ruling names the title, so those are
# marked `not-a-name-spelling` as an EXTENSION rather than assumed. Five are affected and every one
# is the kana transliterated: KASHIKAZE, TAMA TAMASAKI, MANIO, YAKINIKUTEISHOKU, SHIBORIKASUKO. A
# name that says something a transliteration cannot keeps its finding: さりいB spells the English
# name Sally, and よつば◎ますみ。 is printed in Western order.

