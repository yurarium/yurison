  - work: "カナリアは綺羅星の夢をみる"
    latin: "kanaria ha kiraboshi no yumewomiru"
    kind: publisher-romanisation
    seen_on: "https://cdn.img.ichicomi.com/public/series/thumbnail/2550912965923183647_c2c1f2c1d92beb22282bf93423077ec8_1752730099"
    note: >-
      A romanisation rather than an English name, printed under the logo on the volume 1 cover, and
      it CONFIRMS what we hold rather than correcting it: the analyser reads 綺羅星 as キラボシ and
