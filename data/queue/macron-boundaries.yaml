note: Names where our macron says a long vowel and a source spells the two vowels out. Every one needs
  a person, because the two populations look identical from here and only one of them is a fault.
how_to_decide: 'A SOURCE WRITING `ou` FOR `ō` IS A STYLE AND NOT A CORRECTION. MangaUpdates and Wikidata
  both write double vowels where this project writes macrons, so `Karintō` against `Karintou` says nothing
  about either. The style control already offers both.

  WHAT IS A FAULT IS A VOWEL PAIR THAT CROSSES A WORD BOUNDARY, because that is not a long vowel at all.
  御家 is お + うち, so the reading オウチ is o-uchi and `Ōchi` states a long o nobody says; the same shape is
  井上 i-no-ue against `Inōe`, 猫梅 neko-ume against `Nekōme` and 藪内 yabu-uchi against `Yabūchi`. The romaniser
  cannot see a morpheme boundary and never will, so each of these is a reading somebody has to look at.

  Set `decision` to `long-vowel` where our macron is right, or `two-vowels` where the source is, and a
  pass will apply it.'
found: 2026-08-12, from the project owner reading Project Yuriforming!'s credit
