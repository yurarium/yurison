note: 'Names where our macron says a long vowel and a source spells the two vowels out. Read through on
  2026-08-12: 4 are faults and are ruled in `kana.NOT_LONG`; the other 17 are a style, because MangaUpdates
  and Wikidata write ou for ō and the `double` setting already renders exactly that. A name arriving here
  with no `decision` is one nobody has read, which `macron boundaries nobody has ruled on` counts.'
found: 2026-08-12, from the project owner reading Project Yuriforming!'s credit
