how_to_decide: 'A SOURCE WRITING `ou` FOR `ō` IS A STYLE AND NOT A CORRECTION, so most of this list is
  not a fault. WHAT IS A FAULT IS A VOWEL PAIR THAT CROSSES A WORD BOUNDARY, because that is not a long
  vowel at all: 御家 is 御 + 家 so オウチ is o-uchi and `Ōchi` states a long o nobody says, and 井上, ねこうめ and
  藪内 are the same shape. Set `decision` to `two-vowels` and add the reading to `kana.NOT_LONG`, or to
  `long-vowel` and leave it. The project owner ruled on 2026-08-12 that a rule reading morpheme boundaries
  is not worth buying for four names, so this list is how they are settled and the budget is how a new
  one is noticed.'
