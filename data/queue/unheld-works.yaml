# Works the release feed names that this database holds no record of, and what was decided about
# each of them.
#
# WHY A REGISTER AND NOT A FIX. The rows counted by adapters/feedgap.py are works, and a work needs
# an inclusion decision before it needs a record (DEFINITIONS §2). Making the decision is the slow
# half and it is the half that does not have to be repeated: without this file the same five titles
# are examined again at every capture and the reasoning is thrown away each time, which is the
# argument data/rebuttals.yaml already makes for the works that do have records.
#
# THIS FILE SILENCES NOTHING. adapters/feedgap.py joins a ruling onto the work it is about and
# leaves the count exactly where it was. A work ruled `in` and still absent is the state worth
# counting, and the count comes down when the work gains a record. A register that could take its
# own subject out of the number is the failure STANDING-INSTRUCTIONS §13 was written about.
#
# WHAT A RULING MAY REST ON. DEFINITIONS §2 admits a work whose content tier is above `incidental`,
# or which carries a publisher-side label, or which a comparator lists. The comparators here are
# 百合ナビ's WEB連載 list, Web漫画アンテナ's 百合 tag, and a licensed retailer's own 百合 shelf,
# which §2 admitted on 2026-08-04 and placed above an aggregator without making it publisher-side.
# A comparator listing is presumptive and rebuttable, and REQUIREMENTS §1 is firm that a bare
# listing states membership without arguing for it: none of these rows may be cited toward a
# `content_tier`, and none of them is. Where the field is absent below, that is DEFINITIONS §3's
# "no attestation is a legitimate state" and not an unfinished row.
#
# READ BY: adapters/feedgap.py, and through it check.py's `updates naming a work we do not hold`.
source: the sources cited on each row
role: inclusion-ruling
record_type: inclusion_ruling
reviewed: 2026-08-07
reviewed_by: agent, from the built feed of 2026-08-07
