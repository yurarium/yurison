  - work: "フルボイス！"
    platform: "ニコニコ漫画"
    platform_url: "https://manga.nicovideo.jp/comic/70759"
    disposition: in
    admitted_under: "DEFINITIONS §2, a comparator lists it"
    marketing_label: none
    marketing_label_basis: "No publisher-side yuri or GL signal found."
    first_publication:
      country: JP
      venue: "きららベース (芳文社)"
      venue_basis: >-
        The platform's own breadcrumb names the きららベース channel, and the copyright line reads
        (C)科戸コウ/芳文社. Which きらら magazine, if any, carries it is not attested and is left
        unstated rather than guessed.
    excluded_by_7: false
    excluded_by_7_basis: >-
      The work page states 「この作品には次の表現が含まれます 性的な描写」. That is the platform
      describing content, not designating an audience: there is no 成年コミックマーク, no 18禁 or
      R-18, no adult imprint, and きららベース is not an adult channel. §7's test is a designation
      and never a judgement, so none of its four signals is met and the work is not excluded.
    explicit_content: true
    explicit_content_basis: >-
      The platform's own statement above. §7's middle band covers a work with explicit content that
      is not marketed as pornography: it is included and flagged, and a record carries no cover
      image. Recorded here so that whoever makes the record does not have to find it again.
    evidence:
      - source: "百合ナビ"
        tier: C
        kind: comparator-listing
        url: "https://yurinavi.com/"
        retrieved: 2026-08-01
        note: >-
          Listed on the WEB連載中の百合漫画 table against きららベース, updating 08-01. Captured in
          data/coverage/yurinavi-webyuri.yaml. This is the only source that admits the work, and it
          is the weakest admission of the five.
    note: >-
      Serialised from 2025-02-01 and at chapter 19, with no collected volume, which is why no
      retailer shelf speaks to it. The one comparator is enough under §2 and the admission stays
      rebuttable: a publisher-side source placing it elsewhere would settle it, and none has been
      found either way.

  - work: "タイムトラベル少女 ～ミライのサキ～"
    platform: "ニコニコ漫画"
    platform_url: "https://manga.nicovideo.jp/comic/77287"
    disposition: marginal
    admitted_under: "DEFINITIONS §2, a comparator lists it; §9 for the disposition"
    marketing_label: none
    marketing_label_basis: >-
      No publisher-side yuri or GL signal. The platform is the publisher's own arm here, the
      copyright line reads ©DWANGO Co.,Ltd., and it files the work 青年マンガ.
    first_publication:
