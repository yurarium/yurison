      venue: "ニコニコ漫画 (ドワンゴ)"
      venue_basis: "©DWANGO Co.,Ltd. on the work page, and the serialisation begins there"
    excluded_by_7: false
    excluded_by_7_basis: "No designation of any kind. Nothing to exclude on."
    evidence:
      - source: "Web漫画アンテナ"
        tier: C
        kind: comparator-listing
        url: "https://webcomics.jp/seiga/77287"
        retrieved: 2026-08-04
        note: >-
          Tagged 百合 and nothing else. Crowd-tagged, so it states membership and argues no case
          (REQUIREMENTS §1). Captured in data/coverage/webcomics-works.yaml.
      - source: "ニコニコ漫画"
        tier: B
        kind: platform-page
        url: "https://manga.nicovideo.jp/comic/77287"
        retrieved: 2026-08-07
        note: >-
          Serialised from 2026-03-31, five instalments, 漫画 桂明日香 and 企画 ぱぺっときゃすと！,
          filed 青年マンガ. This is the second series of the タイムトラベル少女 franchise. The
          platform's own synopsis names 逢那サキ, a girl who crosses time to reach the person she
          follows, and does not state the other lead's gender.
    why_marginal: >-
      One crowd-tagged comparator admits it and nothing else speaks to it either way. The platform
      is publisher-side and applies no yuri designation, but its categories are demographic and
      format (青年マンガ, 4コママンガ, その他マンガ) with no yuri category to decline, so its silence
      contradicts nothing: DEFINITIONS §2 says outright that a taxonomy omitting yuri is not a
      source without yuri. Settling it would mean reading five chapters and reasoning about the
      characters, which DEFINITIONS §9 says this database does not do at the margin. So the
      presumption stands, the work is recorded, and its record stays out of the default listing
      until a source says something. That is `marginal` doing the job §9 built it for, and it is
      not an exclusion: the work has a page and the page answers.
