# Rulings on DEFINITIONS §6: was this work first published in Japan.
#
# WHY THIS FILE EXISTS. §6 says a work is in scope if its first publication venue was in Japan and
# that `first_publication` IS the inclusion test. The test had never run. `first_publication.country`
# was the literal "JP" in three places, so 2,564 works asserted Japan and none of them had been
# asked, and a work whose Japanese edition is a translation read exactly like one whose Japanese
# edition is the original. `adapters/facts/origin` decides the field now, and where nothing attests
# a country it says so; this file is where a person's answer goes.
#
# WHAT A RULING RESTS ON. The Japanese publisher's own page for the work, which is Tier B under
# REQUIREMENTS §1. A foreign publisher's page may be read to find the question and may not supply
# the stored field, and neither ruling below needs one: 誠文堂新光社 and KADOKAWA each say where
# their book comes from, on their own site, in Japanese.
#
# WHAT IT IS NOT. Not a takedown, which names a requester and a date (REQUIREMENTS §4). Not a
# content withholding, which is `data/source/*/withheld.yaml` and is about what a reader might meet.
# Not a rebuttal, which is `data/rebuttals.yaml` and is about whether a work is yuri: a rebuttal
# keeps the work and takes it out of the default listing, because a doubtful yuri call is a
# judgement about a work this database is entitled to hold. A work first published abroad is not a
# work this database is entitled to hold at all, so an `out-of-scope` ruling stops it being
# published. The source records stay where they are, unedited, and the reasoning stays here.
#
# READ BY: `adapters/facts/origin`, and through it `build.py`, which puts refused works into the
# same register a content flag goes into and therefore out of every surface that register reaches.
# `check.py`'s `scope rulings are accounted for` fails if this file and `run.json` disagree.
#
# `review` IS A FINISHED ROW, NOT AN UNFINISHED ONE. It records that somebody looked, what they
# found, and what is still missing. Without it the same works are examined again at every capture
# and the reasoning is thrown away each time, which is the argument `data/rebuttals.yaml` already
# makes for its `upheld` half.
source: the publisher pages cited on each row
role: scope-ruling
record_type: scope_ruling
reviewed: 2026-08-10
reviewed_by: agent, against data/build of 2026-08-09
rulings:

  - work: w01338
    title: "サンストーン"
    records: [C418518]
    disposition: out-of-scope
    country: US
    country_basis: publisher-states-origin
    country_source: 誠文堂新光社
    why: >-
      Out of scope. 誠文堂新光社's own page for vol.1 gives レーベル名 G-NOVELS, credits 上田香子 as
      翻訳者名 beside 作・画 ステファン・セジク, calls the book an アメコミ and calls this edition a
      邦訳化. The Japanese book is a translation, so the first publication venue was not Japan and
      §6 excludes the work however the shop shelved it. MADB says the same thing in its own field,
      writing the creator as `[上田香子][訳] / [作・画]ステファン・セジク`.
      The country is recorded as US because that is what the publisher's own word アメコミ names.
      Which foreign venue came first is not settled by that page and does not need to be: §6 turns
      on whether the first venue was in Japan, and every candidate answer here is no.
    evidence:
      - source: 誠文堂新光社
        tier: B
        kind: publisher-book-page
        url: https://www.seibundo-shinkosha.net/book/general/20620/
        retrieved: 2026-08-10
        note: >-
          レーベル名 G-NOVELS, 翻訳者名 上田 香子, and the description calls the book a 邦訳化 of an
          アメコミ. The author note on the same page places the artist in Croatia and his work at a
          large American comics publisher.
      - source: メディア芸術データベース
        tier: A
        kind: catalogue-record
        url: https://mediaarts-db.artmuseums.go.jp/id/C418518
        retrieved: 2026-08-05
        note: the record credits 上田香子 with 訳, which is the same statement in a catalogue's terms

  - work: w02084
    title: "オルターエゴ"
    records: ["bw-3b28e445-12a7-4c5a-a0a3-52f538011921"]
    disposition: out-of-scope
    country: ES
    country_basis: publisher-states-origin
    country_source: KADOKAWA
    why: >-
      Out of scope. KADOKAWA's own product page calls the book スペイン発, so the Japanese edition
      is a translation of a Spanish original and §6 excludes the work. Author nationality is not
      what decides it and is not being used: the publisher is stating where the work comes from.
      Nothing in our records could have reached this. The page files the book under label MFC, the
      same general line that carries ordinary Japanese MF titles, and our record holds
      publisher KADOKAWA with imprint MFC; the shop that admitted the work states the same pair.
      A line-level flag reaches this work at no point, which is why the ruling is per work.
    evidence:
      - source: KADOKAWA
        tier: B
        kind: publisher-product-page
        url: https://www.kadokawa.co.jp/product/322508000946/
        retrieved: 2026-08-10
        note: >-
          The description calls the work スペイン発の青春ガールズラブ. The same page gives label MFC,
          発売日 2026年05月22日 and ISBN 9784046854995.
      - source: openBD
        tier: A
        kind: registration
        url: https://api.openbd.jp/v1/get?isbn=9784046854995
        retrieved: 2026-08-10
        note: >-
          The publisher-supplied registration credits アナ・C・サンチェス and states no translator, so
          the catalogue route says nothing here and the product page is the only source that does.

  # ── EXAMINED AND NOT RULED ────────────────────────────────────────────────────────────────────
  #
  # Both arrived from BOOK☆WALKER's yuri shelf under 出版社 SNP, レーベル NETCOMICS, sold by the
  # chapter. Nothing publisher-side has been found either way, so they stay in the corpus and the
  # question stays open rather than being answered on a shop's label field.
  - work: w02333
    title: "落差"
    records: [bw-518608]
    disposition: review
    country: null
    country_basis: foreign-comics-line
    why: >-
      Under review. Three creators are credited in romanised Korean, DOG 作画, eunsu 構成 and
      Gyechasooyeol 原作, the shop sells 68 numbered chapters rather than volumes, and its own
      summary places the story between Seoul and Busan. That is what a Korean webtoon licensed to
      a Japanese shop looks like, and DEFINITIONS §6 excludes one outright. It is not a ruling: no
      Japanese publisher-side page has been found for SNP or for the NETCOMICS label, the shop
      credits no translator, and a shop's label field is not the publisher saying anything.
      What would settle it is a page from whoever publishes the Japanese edition.
    evidence:
      - source: BOOK☆WALKER
        tier: C
        kind: retailer-listing
        url: https://bookwalker.jp/series/518608/
        retrieved: 2026-08-10
        note: 作品情報 states レーベル NETCOMICS, 出版社 SNP, and credits the three creators by role

