  - imprint: "コミックノベル「yomuco」"
    publisher: "パルソラ"
    disposition: "out-of-scope"
    medium: "prose"
    medium_basis: "imprint-is-a-prose-line"
    medium_source: "BOOK☆WALKER"
    reviewed: 2026-08-11
    why: >-
      Out of scope on medium. DEFINITIONS §6 admits manga and refuses prose, and パルソラ's
      コミックノベル「yomuco」 is a line of illustrated prose. One work settles it outright:
      BOOK☆WALKER's listing for 〈ノベル〉初恋シグナル calls the book 「初恋シグナル」初ノベライズ, the
      first novelisation of the app game, and a novelisation is prose. The other ten are ruled with
      it on the line, which is what the evidence is about: none of the eleven appears in the Media
      Arts Database or in openBD, and a commercial two-volume manga from 2016 to 2019 would be in
      the national bibliography; six of the eleven credit an author beside an 絵 illustrator, which
      is the shape of an illustrated novel and occurs nowhere else in the corpus; and two of the
      authors, 森奈津子 and 星井七億, are novelists. The line's own name says コミックノベル.
      A twelfth work arriving on this imprint is covered by this ruling and needs no new one.
    note: >-
      THE SHOP SAYS MANGA AND IS WRONG. BOOK☆WALKER files every one of these under マンガ総合, tags
      each volume マンガ, and shelved them on tag 14 (百合), which is how they were admitted. The
      admission evidence is a retailer shelf row, rank 4, the weakest this project accepts. A shop's
      category is not a statement about the medium any more than its shelf is a statement about the
      genre, and this is the same lesson in the other direction: over-inclusion rather than the
      under-advertising that hides yuri elsewhere.
    evidence:
      - source: "BOOK☆WALKER"
        tier: "C"
        kind: "retailer-listing"
        url: "https://bookwalker.jp/series/201543/"
        retrieved: 2026-08-11
        note: "Listing calls the book 初ノベライズ. Breadcrumb マンガ総合, so the shop's own category disagrees with its own copy."
