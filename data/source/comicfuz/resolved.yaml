# Why this file exists: these works reach us through 百合ナビ's WEB連載 table, whose cells run
# title and author together in one string ("ばっどがーる 肉丸"). Splitting that needs the
# canonical title from the publisher's own page — otherwise the boundary is a guess, and a guess
# invents a title (REQUIREMENTS §6). One confirmed title lets the cell be cut at a known point;
# whatever follows is the author.
#
# `title` and `url` are what the search confirmed. `author_on_page` is recorded only where the
# result stated it; where it is absent the author is still derived from the cell remainder, which
# is a subtraction rather than an attribution.
#
# FUZ is the origin platform for all of these. They were first seen syndicated onto ニコニコ漫画's
# きららベース channel, which is not a platform in its own right (see data/platforms.yaml).
