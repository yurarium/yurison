# Authors established off-platform, for works whose platform states none.
#
# マンガワン publishes no author anywhere a fetch can reach: /manga/<id> 404s for every title, the
# serialisation list and search results carry title and date only, and the reader shows neither.
# A human wanting to know who draws these does not keep reloading マンガワン — they look the work up,
# and the answer is immediate and authoritative. So that is what was done.
#
# Each of these is a volume record in openBD, which is already a Tier-A source in this pipeline, so
# the fact arrives by the same route as every other volume-level author here rather than by a
# screenshot of a search result. Where the work is also on a platform that does state its author,
# that first-party statement is recorded too and is the stronger of the two.
#
# The one I did NOT record is worth keeping visible. マンガワン's purchase card for メイド＆ロイド shows
# ちいさなひとひら in the slot between the chapter title and 消費アイテム, and I nearly took it for the
# author on the strength of its position. The author is みやしろ. Position is not provenance.
source: comparators
