  - work_title: "オカワリいただけただろうか?）</title>\n    <subtitle>四谷寿々は、食べることが好きな女子高生。いつものように食堂でぼっち飯を食べていると、なぜか高身長で同性からも人気の同級生・真島さんにランチに誘われることになった。だが、真島さんには怪しい噂があって…⁉</subtitle>\n    <updated>2026-07-24T03:00:00Z</updated>\n    <id>action:series:2550912964905642274</id>\n    <link href=\"https://comic-action.com/episode/2550912964909179818\"/>\n        <entry>\n            <title>第11話 丑の刻参り（後編）</title>\n            <link href=\"https://comic-action.com/episode/12207421983881261105\"/>\n            <id>action:episode:12207421983881261105</id>\n            <updated>2026-07-24T03:00:00Z</updated>                <giga:freeTermStartDate>2026-07-24T03:00:00Z</giga:freeTermStartDate>            <content type=\"html\">オカワリいただけただろうか?</content>\n            <link rel=\"enclosure\" href=\"https://cdn-img.comic-action.com/public/episode-thumbnail/12207421983881261105-c76e27f8cd16de5af36c9ac74dd26108?1784889369\" length=\"0\" type=\"image/jpeg\" />\n            <author><name>U-temo</name></author>\n        </entry>\n        <entry>\n            <title>第10話 丑の刻参り（前編）</title>\n            <link href=\"https://comic-action.com/episode/12207421983526486419\"/>\n            <id>action:episode:12207421983526486419</id>\n            <updated>2026-04-24T03:00:00Z</updated>            <content type=\"html\">オカワリいただけただろうか?</content>\n            <link rel=\"enclosure\" href=\"https://cdn-img.comic-action.com/public/episode-thumbnail/12207421983526486419-c1ea8c6419d8d965fcf5426b2a85f243?1776834518\" length=\"0\" type=\"image/jpeg\" />\n            <author><name>U-temo</name></author>\n        </entry>\n        <entry>\n            <title>第9話 学校の七不思議 2</title>\n            <link href=\"https://comic-action.com/episode/12207421983318634831\"/>\n            <id>action:episode:12207421983318634831</id>\n            <updated>2026-02-27T03:00:00Z</updated>            <content type=\"html\">オカワリいただけただろうか?</content>\n            <link rel=\"enclosure\" href=\"https://cdn-img.comic-action.com/public/episode-