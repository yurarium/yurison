# カドコミ work codes resolved by external web search restricted to comic-walker.com.
#
# Why these were missing: the カドコミ catalogue is enumerated from the publisher's own 百合 tag
# (348 works). Works the publisher does not tag 百合 are absent from it, so a comparator naming one
# had nowhere to resolve to and stayed 要確認 — reported by a listing site, never confirmed against
# the platform. 忍者と殺し屋のふたりぐらし is the case that showed it.
#
# Tag absence is not evidence about content. These are named by the Tier C yardsticks the same way
# the tagged ones are; what they lack is a publisher label, so they establish no marketing_label
# (DEFINITIONS §4) where the tagged catalogue works do.
#
# Same method as data/source/comicfuz/resolved.yaml: one search per work, one confirmed result,
# no crawling. The code is what the adapter needs; it then reads the work's own page as usual.
