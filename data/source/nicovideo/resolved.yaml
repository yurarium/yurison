# ニコニコ漫画 work ids resolved by external web search restricted to manga.nicovideo.jp.
#
# Why these were unreachable: the adapter targets works by the /comic/<id> URLs the antenna
# supplies. These works reach us only through 百合ナビ, which gives no URL at all — so there was no
# id to fetch, and the 百合ナビ cell runs title and author together, so there was nothing to match
# on either. Both failures at once: フルボイス！ 科戸コウ sat in the feed as an unclassified claim
# on a platform we do watch.
#
# One search each, one confirmed result. ニコニコ states its works as "タイトル / 作者", so the
# same result that gives the id also gives the split — the conflated cell is resolved by the
# platform rather than guessed apart (REQUIREMENTS §6).
