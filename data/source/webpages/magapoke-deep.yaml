# マガポケ — access for chapters below the fold of the work page.
#
# The work page lists twenty chapters and hides the rest behind もっと見る. The rendered adapter
# reads what the page draws on load, so a chapter older than those twenty had a date, a title and
# an author and no access state at all. Five rows in the feed were in that position.
#
# A reader in that position presses the button. So this was collected the same way: the page opened,
# もっと見る pressed until the list stopped growing, and each row's badge class read off the chapter
# it belongs to. 念願の悪役令嬢 goes from twenty rows to 111 that way.
#
# The badge is the platform's own statement and there are three of them, which is the other half of
# why these rows were empty:
#
#   c-episode-item__ico--free          free
#   c-episode-item__ico--ticket-free   free-timed — readable now by spending a 作品チケット
#   c-episode-item__ico--point         purchase, with the price on the badge
#
# adapters/render/ knew only the first and the last, and captured the class with (\w+), which
# cannot match a hyphen — so --ticket-free arrived as "ticket" and fell through to purchase. That
# is fixed there; this file is the five rows the fix cannot reach, because they are past the fold.
#
# No genre label is established here (DEFINITIONS §4).
