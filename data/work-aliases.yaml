# One work written two ways, and the title the database uses for it.
#
# WHY THIS IS CURATED AND NOT A RULE. FEATURES-INTERFACE §2 says a work is one row with several
# sources. Two platforms writing the same title differently break that silently: the row splits,
# the chapter history splits with it, and the shorter half reads `unknown` because it is a partial
# view of something we already hold in full.
#
# A general rule cannot decide these. `norm_work` deliberately keeps `+`, because stripping it
# merged citrus with citrus+ and filed the sequel's releases under the original, and it keeps
# bracketed contents for the same reason: 超深宇宙より愛をこめて【読み切り版】 is a different work
# from the serialisation it sits beside, while 【タテスク】 is the same work in another format.
# Nothing in the string says which, so each is decided on its evidence and recorded here.
#
# ONE CLASS HERE TURNED OUT TO BE A RULE AND HAS LEFT. A reading gloss printed inside a title,
# 念願の悪役令嬢(ラスボス)の身体を手に入れたぞ!, was the single entry of its kind: マガポケ prints
# the gloss over 悪役令嬢 and コミックDAYS does not, so one work stood as two rows of 111 and 87
# chapters, and the chapter titles aligned across the split (マガポケ's 【第101話】飛行戦闘
# continues the run コミックDAYS carries to 第８７話). `adapters/names/gloss.py` now takes the gloss
# off every title that prints one and reads the run it covers the way the bracket says, so that
# entry answered a question nothing asks any more and was removed with the rule that replaced it.
#
# `variant` is matched after norm_work, so width, spacing and punctuation need not be reproduced
# exactly. Adding a row merges two rows in the build: check the chapter count afterwards, because
# two coverages of one story should dedupe to the longer, never sum.
aliases:
  - variant: "フィダンツァートのためいき : 完全版"
    canonical: "フィダンツァートのためいき"
    note: >-
      一迅社's own catalogue lists the work as フィダンツァートのためいき, ISBN 9784758070867,
      published 2010-07-17, and this database holds only the 2018 完全版 reissue, ISBN
      9784758078597. So the colon is ISBD marking an edition statement and the canonical name is
      what the house prints. Filing the edition under the work is the same treatment eight other
      完全版 records got when their base title was already held; this one had no base row to merge
      into, which is why it stayed behind.
    retrieved: 2026-08-08
