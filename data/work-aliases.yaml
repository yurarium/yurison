# One work written two ways, and the title the database uses for it.
#
# WHY THIS IS CURATED AND NOT A RULE. FEATURES-INTERFACE §2 says a work is one row with several
# sources. Two platforms writing the same title differently break that silently: the row splits,
# the chapter history splits with it, and the shorter half reads `unknown` because it is a partial
# view of something we already hold in full.
#
# A general rule cannot decide these. `norm_work` deliberately keeps `+`, because stripping it
# merged citrus with citrus+ and filed the sequel's releases under the original, and it keeps
# bracketed contents for the same reason: 超深宇宙より愛をこめて【読み切り版】 is a different work
# from the serialisation it sits beside, while 【タテスク】 is the same work in another format.
# Nothing in the string says which, so each is decided on its evidence and recorded here.
#
# ONE CLASS HERE TURNED OUT TO BE A RULE AND HAS LEFT. A reading gloss printed inside a title,
# 念願の悪役令嬢(ラスボス)の身体を手に入れたぞ!, was the single entry of its kind: マガポケ prints
# the gloss over 悪役令嬢 and コミックDAYS does not, so one work stood as two rows of 111 and 87
# chapters, and the chapter titles aligned across the split (マガポケ's 【第101話】飛行戦闘
# continues the run コミックDAYS carries to 第８７話). `adapters/names/gloss.py` now takes the gloss
# off every title that prints one and reads the run it covers the way the bracket says, so that
# entry answered a question nothing asks any more and was removed with the rule that replaced it.
#
# `variant` is matched after norm_work, so width, spacing and punctuation need not be reproduced
# exactly. Adding a row merges two rows in the build: check the chapter count afterwards, because
# two coverages of one story should dedupe to the longer, never sum.
aliases:
  - variant: "フィダンツァートのためいき : 完全版"
    canonical: "フィダンツァートのためいき"
    note: >-
      一迅社's own catalogue lists the work as フィダンツァートのためいき, ISBN 9784758070867,
      published 2010-07-17, and this database holds only the 2018 完全版 reissue, ISBN
      9784758078597. So the colon is ISBD marking an edition statement and the canonical name is
      what the house prints. Filing the edition under the work is the same treatment eight other
      完全版 records got when their base title was already held; this one had no base row to merge
      into, which is why it stayed behind.
    retrieved: 2026-08-08
  - variant: "うどみょん１"
    canonical: "うどみょん"
    note: >-
      BOOK☆WALKER's own listing carries the volume number in the volume's title, and this record's
      title was taken from it because the shop stocks one volume of the work. `bwingest` stripped a
      volume number only where a work had more than one, so a doujin the shop holds a single volume
      of could never qualify. The record's own reading note already read "apart from the volume
      number" while the title kept it. The rule now reads the full-width digit as the boundary it
      is; this row is for the record already written.
    retrieved: 2026-08-10
  - variant: "ふぉーおぶあかいんど！2"
    canonical: "ふぉーおぶあかいんど！"
    note: >-
      The same case as うどみょん１ with a half-width digit, where what marks the number off is the
      ！ before it. studio Kiro's listing is one volume, so the sibling test could not fire here
      either.
    retrieved: 2026-08-10
  - variant: "LatteComi コミックアンソロジー【百合】（単話版）（LatteComi）"
    canonical: "LatteComi コミックアンソロジー【百合】（単話版）"
    note: >-
      The trailing bracket repeats the title's own first word. LatteComi is ブシロードワークス's label
      and the title already opens with it, so the bracket states nothing the name does not. BOOK☆WALKER
      holds the same work as LatteComi コミックアンソロジー【百合】 with no bracket at all. Only the
      ニコニコ漫画 route carries it, which is where the other two labels of this shape came from too.
    retrieved: 2026-08-10
  - variant: "公爵令嬢の籠絡ミッション～魔王との政略結婚が、人類最後の切り札です!…って、魔王が女の子の場合はどう..."
    canonical: "公爵令嬢の籠絡ミッション～魔王との政略結婚が、人類最後の切り札です！…って、魔王が女の子の場合はどうすればいいのですか！？～"
    note: >-
      A listing truncated the title and the trailing `...` is the listing's, not the work's. MADB
      and 秋田書店's own ヤングチャンピオン capture both carry it whole. The two forms were two works
      and the short one was queued for somebody to translate.
    retrieved: 2026-08-10
  - variant: "病弱少女、転生して健康な肉体(最強)を手に入れる ～友達が欲しくて魔境から旅立ったのですが、どうやら..."
    canonical: "病弱少女、転生して健康な肉体（最強）を手に入れる　～友達が欲しくて魔境から旅立ったのですが、どうやら私の魔法は少しおかしいようです！？～"
    note: >-
      The same truncation, from the same route. The full form is already held beside it, so this
      work was in the corpus twice.
    retrieved: 2026-08-10
  - variant: "アイドル総選挙4位だった私が魔王を倒すんですか？（Lilie comics）"
    canonical: "アイドル総選挙4位だった私が魔王を倒すんですか？"
    note: >-
      Lilie comics is the imprint and the ニコニコ漫画 route wrote it into the title, so the work was
      in the corpus twice. The bracketed row is the one a reader met, and its ruby grouped 総選挙4位
      under そうせんきょ4い, putting a digit inside the kana; the plain row already reads 総選挙 as
      そうせんきょ, 4 as itself and 位 as い. Same shape as （OrangeVox）, （コスモブルー） and （LatteComi）.
    retrieved: 2026-08-10
