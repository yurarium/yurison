      - id: D9
        title: A lint for a fact with a second home, so the census cannot go stale
        state: done
        note: >-
          adapters/lint/duplicates.py runs in the gate as the budget `facts with more than one home`, 35 to 12.
          docs/duplicates-allowed.yaml carries the cases somebody argued, so the number is a list of open ones and not a wall: four record shapes two adapters legitimately both emit, each saying what would make it a divergence again.
          One entry says plainly that the argument has NOT been made, for the engine registry in editions/capture and editions/engines, because an allow-list that quietly absorbs what you meant to fix is worse than none.
          Its self-test keeps a literal duplicate on purpose, since a canary is the one place a duplicate belongs.
      - id: D10
        title: title cataloguing, which already has one reader
        state: done
        note: >-
          adapters/isbd.py is adapters/facts/cataloguing, with an entry point, its own test at 48 checks, its own checks.py and a BLINDSPOT.md.
          The count moved with the rule: `titles carrying cataloguing punctuation` was measured in check.py while the rule lived in isbd.py, so the two were free to disagree about what a mark is.
          THEY HAD ALREADY DRIFTED, in two ways found by moving it.
          The budget's docstring said three titles were deliberate refusals that "stay visible instead of being defined out of the count", and all three are in RULED and have been for some time, so the sentence outlived the work it described.
          And check.py's EQUALS_ANY spelled the sign three ways including ゠ at U+30A0, the katakana double hyphen used between the halves of a transliterated name, while the copy I moved had two: one file's rule and another file's measure of it, differing by one character.
          The class has one home now and check.py asks for it.
          The blind spot is stated: a house that prints a sign is indistinguishable from a cataloguer who transcribed one, and RULED is a list a person grows by reading the publisher's own page.
      - id: D11
        title: imprint, which already has one reader
        state: done
        note: >-
          adapters/names/imprints.py is adapters/facts/imprint, with an entry point, its suite at 61 checks and a BLINDSPOT.md; facts/namekey got the BLINDSPOT.md it was missing at the same time.
          IT HAS NO checks.py AND THE DOCSTRING SAYS WHY, because every other fact has one. The two counts that measure it are deliberately independent of the module: they ask the corpus for its strings and the SHIPPED map whether it holds each, importing nothing and folding nothing, since a matcher that gave every unrecognised string a line of its own would satisfy a check written against itself by construction. Moving them beside the fact is the one place that would be wrong.
          Its blind spot is the fold it cannot see: a string placed under the WRONG line is not reported at all, because the registry is what the module believes. The counter-cases in the suite stand in for that count, run against the shipped registry rather than a fixture.
          THE MOVE ITSELF FOUND A PATH BUG, which is the ordinary hazard of a file going one directory deeper: the suite located the registry by counting parents and quietly loaded nothing, so 61 checks became a KeyError rather than a wrong pass.
      - id: D12
        title: work identity
        state: todo
      - id: D13
        title: dates
        state: todo
      - id: D14
        title: inclusion
        state: todo
      - id: D15
        title: Rendering surfaces derived from the renderer, not listed
        state: done
        note: >-
          interface.renderers() reads app.js and returns every function that hands its caller text a naming primitive touched; the invariant `every renderer is ruled` requires each to be a surface or to be argued in NOT_A_SURFACE.
          THE BOUNDARY IS WHAT THE FUNCTION DOES WITH THE STRING. A function counts when it calls a primitive anywhere, or when it RETURNS a call to something that does. Calling everything transitively gives 52 and sweeps in every paint function; asking only for a direct call gives 18 and misses creditLine, which returns linkedCredits, which returns authorLabel. The rule that catches creditLine and leaves renderCat alone is the return.
          Seeded with the primitives AND with everything SURFACES already names, so the derived set is a superset of the table by construction and the answer is what it holds that the table does not.
          Thirteen were derived and unlisted, and each now carries a reason: eight paint a region and have no data path of their own, creditText is the searchable form, creditGapText is a count, personShown decides whether to list somebody, sourceBoth is a citation and stateLabel is the interface's own English.
          test_interface plants the chain that shipped the fault, three links deep, and requires creditLine and linkedCredits found and renderCat left alone.
          Blind spot stated: a renderer written as an arrow function or a method is invisible, which is why the exemptions carry reasons rather than being a second list of names.

  E:
    title: The residue the first round recorded and did not clear
    items:
      - id: E1
        title: Eight comments asserting an impossibility with nothing to prove it
        state: done
        note: >-
          Eight to zero, and three of the eight were the instrument and not the comment.
          Two were past narrative caught by a bare `never reached`: a fix to the renderer never reached what it had already rendered, and 縁山 never reached a row.
          Those are transitive past tense, so the phrase now wants a copula, and the self-test keeps both beside "this branch is never reached" so the narrowing is held to having lost nothing.
          A third was the evidence pattern reading `proved` and `proven` but not `proves`, which reported two comments that named the assertions directly below them.
          Of the five real ones, two named the four cases in test_credits that hand the analyser a reader returning マチガイ for every name, and one named the assertion beneath it.
          TWO WERE WRONG AND WERE CORRECTED RATHER THAN EVIDENCED. `no-print-edition` was called a count that will never fall, but a web serial that later gets a tankōbon leaves it; what is true is that no pass moves it, because the change arrives from a capture finding the printing.
          The tics CJK exemption said a decorative emoji in our own English would never share a line with Japanese; it now says what the exemption costs, and the self-test pins both sides.
          Also removed a comment block duplicated verbatim in the claims lint itself.
      - id: E2
        title: Two modules called store
        state: done
        note: >-
          Renamed to adapters/relational, which is what its own docstring already called it.
          THE HAZARD WAS REAL AND MEASURED, not a tidiness complaint: the package puts adapters/names on its own sys.path, so a bare `import store` inside adapters/store resolved to adapters/names/store.py, which I reproduced before touching anything.
          The workaround in place was a comment asking the next reader not to reorder two lines.
          Renamed while it had one importer, since stage C makes it load-bearing.
          The guard is `shadowing.py --modules` and the invariant `a name is answered by one module`, which reads the actual sys.path.insert calls so it reports a name only where two directories are on the path at once.
          Thirteen platforms hold a releases.py and that is right, so a blanket rule would have been a nine-entry wall; the narrow rule finds one thing, and running it against the tree as it was before the rename finds `store` and nothing else.
          Two of my own faults on the way, both caught by the fixture rather than by reading: the insert pattern used [^)]* and could never reach past Path(__file__), so it silently reported nothing at all, and counting a directory's own __init__.py made every pair of packages a collision.
      - id: E7
        title: Compiled bytecode was inside the green-tree token's covered set
        state: done
        note: >-
          Two .pyc were tracked from before the ignore rule, so merely importing build or crossplatform rewrote a file the token hashes and it was refused for a tree nobody had touched.
          Found while triaging the worktrees, every one of which showed as dirty for that reason alone.
          Untracked, and the covered set now excludes compiled files, which the self-test asserts against the real set rather than a fixture: untracking two files is not a rule.
      - id: E3
        title: The glued-romanisation shape, Uedakyōko
        state: todo
      - id: E4
