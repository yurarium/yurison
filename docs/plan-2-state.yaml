# The only hand-written input to the tracker.
#
# ONE LINE PER ITEM, because a status somebody decided is the one thing a machine cannot derive.
# Everything else on the page (timings, the fact inventory, budget movements, the open residue) is
# measured by adapters/tracker.py from the tree, so it cannot be claimed better than it is.
#
# state: todo | doing | done | dropped
# note:  what changed, or why it was dropped. Required for `done` and `dropped`.
#
# A `done` with no note fails `./adapters/tracker.py --check`, which the gate runs. That is the
# smallest guard against the fault this file exists to prevent: the first round's tracker showed a
# step complete that had never been started.

generated_by: adapters/tracker.py
plan: docs/REFACTOR-PLAN-2.md

stages:
  A:
    title: The cycle stops re-answering itself
    items:
      - id: A1
        title: A green-tree token, hashing what the checks read
        state: done
        note: >-
          adapters/greentree.py.
          Hashes every tracked file, all of data/build and the deployed site data and interface: 4,370 files in 0.19 s, so over-approximating costs nothing and being clever is how the set comes to be wrong.
          Refuses itself if the tree moved, if it covers a different set, or if it records a different run, and it excludes itself from its own hash because writing it invalidated it.
          Push skips 127 s.
      - id: A2
        title: deploy.sh stops running the checks
        state: done
        note: >-
          deploy.sh ran every check after copying so the published report would not claim violations the copy had fixed.
          Three invariants read the deployed tree, derived from which ones name SITE and not from the comment, which said two.
          check.py --deploy-window re-answers those and patches checks.json.
          37 s to 1 s; deploy 39 s to 3.7 s.
      - id: A3
        title: A build skips the checks by default
        state: done
        note: >-
          A build now skips the checks unless --checks is passed.
          The flag existed and went unused, which was a sign the default was wrong.
          build.py 79 s to 41.7 s.
          The hooks run check.py --gate, which ignores both flags.

  B:
    title: The expensive checks stop rescanning what has not changed
    items:
      - id: B1
        title: stock phrasing in comments caches per file
        state: done
        note: >-
          12.93 s to 0.02 s warm, and the gate 66.7 s to 54.0 s.
          The mechanism is adapters/filecache.py rather than code inside the budget, because the same shape fits several other checks that walk the tree and answer per file.
          Keyed on the content of each file AND on the content of tics.py, so changing a rule throws the whole cache away: a cache that survives a rule change is a check that has silently stopped asking, which is worse than the seconds it saves.
          tics.py imports only the standard library, so its own text is the whole of what the count depends on, and the docstring says that is the caller's job to get right.
          Pruning to the current set looked tidy and made `git checkout` of one file cost a rescan, so entries are kept to a cap of 20,000 and the answer for restored content is still there.
          It lives in data/cache and not data/build, since the green-tree token hashes the latter and a cache written during a gate would invalidate the token that gate is about to write.
          Nine cases in test_filecache.py, including the rule change, the restore, the added file, the dropped file and a corrupt cache.
      - id: B2
        title: deploy.sh regenerates only pages whose content changed
        state: todo
      - id: B3
        title: Per-check timings, so the next slow one is visible
        state: done
        note: >-
          Every check and every phase of a gate is timed and the run says where the seconds went; checks.json records the same numbers under `seconds`.
          It found two things in its first run that guessing had missed for two rounds.
          THE GATE WAS RUNNING ITSELF TWICE. Regenerating the tracker runs mergecheck.py, which runs check.py --runtime as a child, so a gate was a gate plus a whole second run: 20.5 s of 86, and the child overwrote the report the gate had just written, which is why eight source budgets were published with value null.
          The tracker is handed the numbers the gate already measured, and that also lifts mergecheck's own blind spot, since a --runtime child never measures a source budget and `stock phrasing in comments` is the budget it was written for.
          Writing the report also called every invariant and every budget a second time to fill in the examples; the loop keeps its results now.
          Gate 86.5 s to 66.7 s, tracker regeneration 20.5 s to 0.4 s.
          What is left is legible: proving the checks can fail 18.6 s, stock phrasing 12.9 s, content flags 7.6 s, no ruby over bare Latin 4.7 s, and 100 other checks sharing 8.5 s.

  C:
    title: The store becomes load-bearing
    items:
      - id: C1
        title: Nothing writes to the store except the compiler, proved by a lint
        state: done
        note: >-
          adapters/lint/onewriter.py and the invariant `the store has one writer`, at zero.
          It reads source and asks which files hand a changing statement to a cursor, or open their own connection to a database, and it exempts adapters/relational alone.
          The property is what keeps the store derived: everything in it is rebuilt from data/build plus the rulings the facts hold, so a pass reaching in to fix one row makes the database a source of truth nobody declared and the next rebuild throws that row away.
          Its self-test plants a write outside the compiler, a second connection, the compiler's own write and a SELECT, and requires the first two caught and the last two left alone.
          Its blind spot is SQL assembled at runtime, which is why the rule is also written in the store's own docstring.
      - id: C2
        title: The cascade is gated on output change, never on input change
        state: done
        note: >-
          adapters/relational/delta.py. `write` compares before it writes and returns whether anything changed; a write producing the value already there is a no-op and cascades nothing.
          `converge` recomputes what a delta touched and follows only the derivations whose ANSWER moved.
          test_delta plants the case that makes it worth having: a role changed on a row, a real change to an input, where no derivation reads that column and the cascade is empty. Gating on input change is what that avoids.
      - id: C3
        title: Convergence to a fixed point, which is the equivalence argument
        state: done
        note: >-
          `converge(db, touched)` returns the derivations that moved and the number of passes, and raises rather than spinning if a registry cannot settle.
          A pure derivation plus an idempotent write means the fixed point a delta reaches is the fixed point a rebuild produces, so equivalence is a property of the construction rather than something a comparison discovers.
          Nothing in the real registry depends on another derivation today, so the loop would have been untested by the tree as it stands: test_delta drives a three-link chain and requires three passes, then requires a second run to move nothing, and requires a cyclic registry to be refused.
      - id: C4
        title: Corpus-wide reductions recomputed freely, their digests deciding the cascade
        state: done
        note: >-
          A derivation is recomputed freely and its DIGEST decides the cascade. Measured before building it: scanning every credit surface is 1.2 ms, grouping every credit by its works 4.1 ms, grouping all 4,989 claims 2.4 ms.
          The store's standing questions ARE the derivations, typed once in delta.DERIVATIONS, because a question the store answers and a derivation whose digest gates the cascade are the same thing and two copies of the SQL would let a partial update and a full rebuild answer differently.
      - id: C5
        title: A focused test per delta kind, including delete and retract
        state: done
        note: >-
          test_delta.py, 29 checks, one focused case per kind in delta.KINDS: insert, update, delete, merge, divide and retract.
          Delete and retract get the most: an output whose input disappeared has nothing left to notice it, so both assert the recorded answer moved BACK, which is what a stale digest would miss.
          Merge and divide are both directions of the same question, since a wrong join erases a person and a wrong split invents one.
      - id: C6
        title: Differential site build, keyed on the digest of the rows an artefact renders
        state: dropped
        note: >-
          Measured before starting it. Writing every page costs 0.8 s: stubs.py writes 3,048 work
          pages and pages.py writes 2,402 credit and publisher pages, unconditionally, in under a
          second. The 39 s I attributed to page generation was check.py --runtime, the fourth run
          of the checks in one cycle. Dropped as effort against eight tenths of a second.
      - id: C7
        title: A weekly CI run of the cache-free path, compared against the incremental result
        state: done
        note: >-
          .github/workflows/equivalence.yml, weekly, plus `--equivalent` to run it by hand.
          It compares the derivations the store RECORDED, not fresh ones: recomputing before comparing would repair the exact fault it exists to find, a derivation whose reads declaration missed a table so its digest never moved.
          IT COMPARES THE ROWS AS WELL, one ordered digest per table, because two stores can agree on five counts and hold different data. That is what caught the canary: deleting 40 work_credit rows and converging on a table no derivation reads left the counts agreeing and the table 4,241 against 4,281, with three of the missing rows named.
          It reports and does not repair, because overwriting the incremental store with the rebuilt one hides the bug until the next divergence.
          The same run exercises ./cycle.py --full, which refuses the token, every remembered pass and the per-file cache.
      - id: C8
        title: The eight researched readings carrying no reasoning
        state: done
        note: >-
          Refused claims 8 to 0, claims 4,989 to 4,997, and the enforcement hole closed.
          THE DECISION WAS WHICH FIELD IS THE READING'S REASONING. curate.problems accepted `note` as a fallback for `reading_note` and so reported nothing, while the store's CHECK read reading_note alone and refused eight rows.
          The store was right, and the records say so themselves: three of them carry an explicit empty reading_note beside a `note` that argues for the ENGLISH name, several saying only which licensor page states the Japanese title, which is evidence about a translation.
          A record carries nine reading_ keys precisely so a claim about one predicate is not settled by an argument about another.
          Thirteen entries in curated.yaml now carry a reading_note: nine had the reasoning misfiled under `note` and it moved, four never had it written and now state the ground, 狼 being おおかみ with オウカミ a back-conversion artefact.
          Edited as text and not through a YAML round trip, because safe_dump reformatted all 86,746 lines the first time and buried a thirteen-entry change.
          test_curate now plants a note about the English name and requires it refused.
          FOUND ON THE WAY: `curate --apply` collapses カシイ アオイ to カシイアオイ and drops reading_boundary on 20-odd authors, because the overlay holds an older reading than the pass that added the division. Recorded as C10 and reverted, not shipped.
      - id: C9
        title: analyser gets a ruling or a recorded reason
        state: done
        note: >-
          A recorded reason, which is the second of the two the item allows, put where the vocabulary lives.
          `analyser` is the commonest source kind in the corpus at 3,056 readings and READING_ATTRIBUTION has no row for it, because that table answers who may be believed to have STATED a reading and a morphological analyser states nothing.
          The pair has to exist somewhere, since the store will not hold a claim whose basis it has never heard of, and it was written in the loader: a vocabulary decision sitting in the code that reads the data.
          facts/reading.analyser_pair() and DEFAULT_BASIS own it now, beside the table they are an exception to, and the loader asks.
          IT IS STILL NOT A RULING. What an analyser's output is worth beside a stated reading belongs to the owner, the way community-printed was settled on 2026-08-09. The conservative position holds until then: STATED_BASES does not carry it, so nothing asks a reader to believe a source said it, and `renderings resting on a mechanical romanisation` counts the population. Overturning it is one line and the budget that moves says how much it touched.
          Recorded in facts/reading/BLINDSPOT.md and pinned by four cases in test_reading.

  D:
    title: What the census found, and the facts the first round did not reach
    items:
      - id: D1
        title: A name's comparison key has three incompatible answers across thirteen folds
        state: done
        note: >-
          DECIDED, not deferred.
          There are two questions and thirteen functions were answering both under one name.
          `facts/namekey.fold` is the IDENTITY key: NFKC and the space, which are typography and nothing else.
          Measured over 6,076 surfaces: the space merges 108 pairs and every one is one person, 源 久也 and 源久也.
          Case merges 4, the interpunct 3, brackets 57, and each of those can also merge two things that are not one.
          The project already ruled that a wrong join erases a person while a wrong split invents one, so the identity key takes only typography and every judgement lives in `loosely`, which a caller opts into by name.
          Four identity folds now delegate and agree on all 6,076 surfaces; check.py held three more copies and now asks.
          Five that answered the OTHER question are renamed `match_key`, because the shared name is what produced thirteen answers, and they stay separate: they are genuinely different rules, one stripping bracket characters and keeping the contents where another strips the span.
          Two were never name keys at all and are now `width`; one folded rows into a document and is `fold_in`.
      - id: D2
        title: Six distinct implementations of kata, kana to katakana
        state: done
        note: >-
