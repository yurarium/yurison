  E:
    title: The residue the first round recorded and did not clear
    items:
      - id: E1
        title: Eight comments asserting an impossibility with nothing to prove it
        state: done
        note: >-
          Eight to zero, and three of the eight were the instrument and not the comment.
          Two were past narrative caught by a bare `never reached`: a fix to the renderer never reached what it had already rendered, and 縁山 never reached a row.
          Those are transitive past tense, so the phrase now wants a copula, and the self-test keeps both beside "this branch is never reached" so the narrowing is held to having lost nothing.
          A third was the evidence pattern reading `proved` and `proven` but not `proves`, which reported two comments that named the assertions directly below them.
          Of the five real ones, two named the four cases in test_credits that hand the analyser a reader returning マチガイ for every name, and one named the assertion beneath it.
          TWO WERE WRONG AND WERE CORRECTED RATHER THAN EVIDENCED. `no-print-edition` was called a count that will never fall, but a web serial that later gets a tankōbon leaves it; what is true is that no pass moves it, because the change arrives from a capture finding the printing.
          The tics CJK exemption said a decorative emoji in our own English would never share a line with Japanese; it now says what the exemption costs, and the self-test pins both sides.
          Also removed a comment block duplicated verbatim in the claims lint itself.
      - id: E2
        title: Two modules called store
        state: done
        note: >-
          Renamed to adapters/relational, which is what its own docstring already called it.
          THE HAZARD WAS REAL AND MEASURED, not a tidiness complaint: the package puts adapters/names on its own sys.path, so a bare `import store` inside adapters/store resolved to adapters/names/store.py, which I reproduced before touching anything.
          The workaround in place was a comment asking the next reader not to reorder two lines.
          Renamed while it had one importer, since stage C makes it load-bearing.
          The guard is `shadowing.py --modules` and the invariant `a name is answered by one module`, which reads the actual sys.path.insert calls so it reports a name only where two directories are on the path at once.
          Thirteen platforms hold a releases.py and that is right, so a blanket rule would have been a nine-entry wall; the narrow rule finds one thing, and running it against the tree as it was before the rename finds `store` and nothing else.
          Two of my own faults on the way, both caught by the fixture rather than by reading: the insert pattern used [^)]* and could never reach past Path(__file__), so it silently reported nothing at all, and counting a directory's own __init__.py made every pair of packages a collision.
      - id: E7
        title: Compiled bytecode was inside the green-tree token's covered set
        state: done
        note: >-
          Two .pyc were tracked from before the ignore rule, so merely importing build or crossplatform rewrote a file the token hashes and it was refused for a tree nobody had touched.
          Found while triaging the worktrees, every one of which showed as dirty for that reason alone.
          Untracked, and the covered set now excludes compiled files, which the self-test asserts against the real set rather than a fixture: untracking two files is not a rule.
      - id: E3
        title: The glued-romanisation shape, Uedakyōko
        state: todo
      - id: E4
        title: Kana spelling a name from another language, Sutefan Sejiku
        state: todo
      - id: E6
        title: The three branches holding work main never took
        state: todo
      - id: E5
        title: Fifteen leftover worktrees
        state: doing
        note: >-
          Triaged, not yet removed: removing a worktree is denied to me here and needs the user to run it.
          Fourteen worktrees, twenty-one work branches. Eighteen branches are fully contained in main and their worktrees hold nothing but recompiled bytecode drift, so both go.
          THREE CARRY WORK THAT IS NOT IN MAIN, measured by test-merge rather than assumed: work/ichijinsha holds adapters/ichijinsha.py at 698 lines with its tests and 543 captured source pages, and conflicts with main in check.py alone; work/q10 holds the byline division work and conflicts in credit_identity, pages and build; work/romfallback holds adapters/names/organisations.py and conflicts in creditline, inputs and pass4_analyser.
          Every other conflict is a generated artefact, so a merge takes main's and rebuilds.
          Main reached ルミナス＝ブルー by a narrower route, isbd.RULED, so the 一迅社 capture is not superseded and is the one piece here that would cost re-fetching.
          Merging them is E6 and not this item: it changes what the corpus contains, which does not belong inside tree hygiene.

  F:
    title: The common case stops re-verifying what did not change
    items:
      - id: F1
        title: Test selection from COVERS, which every suite already declares
        state: todo
      - id: F2
        title: Incremental verification, each check declaring the inputs it reads
        state: todo
      - id: F3
        title: Incremental build, stages keyed on the digest of their inputs
        state: todo
      - id: F4
        title: The gate and the tests run concurrently, being independent of each other
        state: done
        note: >-
          ./cycle.py. 27.4 s together against 54.3 s one after the other, and 82 s before this stage began.
          THEY WERE ALSO BOTH PROVING THE SAME THING: ./test.py runs check.py --self-test as one of its suites and --gate runs the very same self-test before it will pass anything, 16 s each in one cycle.
          The tests carry it and the gate is told so by --proved-by, which is sound only because the driver reports failure when the test half fails; nothing but cycle.py passes the flag and --full never does.
          The pre-push hook runs the driver rather than the two in sequence.
          Separately, the copy a canary is planted into was 18.3 of the self-test's 18.4 seconds: twelve million deepcopy calls over data that came out of JSON, where only the containers need copying and a string cannot be mutated. Anything unrecognised still goes to deepcopy, and the fingerprint taken before any probe ran is the net under it. 18.4 s to 16.1 s.
      - id: F5
        title: A cache-free --full path, which the scheduled CI run exercises end to end
        state: done
        note: >-
          ./cycle.py --full. Each half proves itself, YURA_NO_TOKEN refuses the green-tree token, and the per-file cache is MOVED ASIDE rather than deleted, so a run that disagrees with the incremental one leaves both answers on disk to compare.
          64.9 s against 27.4 s, slower on purpose: a cycle that only ever runs the fast path has never checked that the fast path agrees with anything.
          It found a real fault the first time it ran. greentree's own self-test failed under YURA_NO_TOKEN, because the override refuses every token and the suite read that as a token wrongly refused, so the one run that most needs the suite was the one run where it could not pass. The override is now a case the suite tests and then sets aside.
