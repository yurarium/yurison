  D:
    title: What the census found, and the facts the first round did not reach
    items:
      - id: D1
        title: A name's comparison key has three incompatible answers across thirteen folds
        state: done
        note: >-
          DECIDED, not deferred.
          There are two questions and thirteen functions were answering both under one name.
          `facts/namekey.fold` is the IDENTITY key: NFKC and the space, which are typography and nothing else.
          Measured over 6,076 surfaces: the space merges 108 pairs and every one is one person, 源 久也 and 源久也.
          Case merges 4, the interpunct 3, brackets 57, and each of those can also merge two things that are not one.
          The project already ruled that a wrong join erases a person while a wrong split invents one, so the identity key takes only typography and every judgement lives in `loosely`, which a caller opts into by name.
          Four identity folds now delegate and agree on all 6,076 surfaces; check.py held three more copies and now asks.
          Five that answered the OTHER question are renamed `match_key`, because the shared name is what produced thirteen answers, and they stay separate: they are genuinely different rules, one stripping bracket characters and keeping the contents where another strips the span.
          Two were never name keys at all and are now `width`; one folded rows into a document and is `fold_in`.
      - id: D2
        title: Six distinct implementations of kata, kana to katakana
        state: done
        note: >-
          adapters/lint/duplicates.py, registered as the budget `facts with more than one home` at 35.
          It looks for a string vocabulary, a dict shape, a regex or a function body in two files.
          Its own docstring says what it cannot see, which is most of the problem: a rule written as different code twice is invisible, and the thirteen folds were found by this while their DISAGREEMENT was found by running them.
      - id: D3
        title: Twelve regexes answering "is this Japanese", three of them disagreeing on kana
        state: done
        note: >-
          facts/script owns four questions that thirty regexes were sharing: has_kana, has_kanji, has_script and has_typography.
          Measured: the two main "is this Japanese" classes agree on all 6,076 surfaces, so extension A and the compatibility ideographs never bite here; check.JAPANESE differs on 18 and is asking a different question, since ＦＬＯＷＥＲＣＨＩＬＤ is Japanese typography with no Japanese letter.
          One was simply wrong: ・ sits at U+30FB inside the katakana block, so two kana tests called flower・flower kana.
          A separator is not a letter.
          The letter tests span letters and the safety net spans whole blocks, because a miss on an English page is visible to a reader.
          My own widening spanned Hangul and Yi, because the literal 豈 is U+8C48 and the compatibility block begins at U+F900 with a different character that looks the same; test_interface caught it by asking whether 싱 is Japanese.
          Five callers converted, 24 narrower patterns left alone as rules about one source each.
