      - id: D8
        title: Fifteen scraping patterns written twice or more
        state: done
        note: >-
          adapters/htmlbits.py owns the patterns every web source shares: the document title, og:title, the RSS and Atom wrappers, a link, alt text and a definition pair.
          Two spellings were in use for the title and two for og:title, and the tolerant form of each keeps what both callers had, so a title broken over a line now reads where one spelling missed it.
