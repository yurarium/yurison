  F:
    title: The common case stops re-verifying what did not change
    items:
      - id: F1
        title: Test selection from COVERS, which every suite already declares
        state: done
        note: >-
          ./test.py --changed. 26.9 s to 1.1 s when nothing moved, and the cycle is now bounded by the gate alone.
          A suite is skipped only when its own file, everything it declares in COVERS, and the harness are all byte for byte what they were when it last passed; a failing suite keeps its old key so it runs again.
          THE TITLE WAS WRONG: two suites declared nothing, so they could never be keyed and always ran, one of them for 6.4 s. adapters/names/test_names.py now names kana, store, pass2_bulk and pass4_analyser.
          A FIXTURE IS PART OF THE SUBJECT, so any data/fixtures path written in a suite goes into its key, and a path naming a directory expands to its files, since hashing a directory hashes nothing. Proved by touching a captured comicfuz page and watching exactly that one suite come back.
          AND SO IS THE BUILD, for a suite that reads it. check.py --self-test plants its canaries in the real context, so keyed on check.py alone it would be skipped after a rebuild that changed what the canaries land in; ten suites re-run when data/build moves.
          --canary and cycle.py --full never use it.
      - id: F2
        title: Incremental verification, each check declaring the inputs it reads
        state: done
        note: >-
          check.py --incremental. A cycle where nothing moved is 2.0 s, from 372 s when this plan was written.
          NOT 110 DECLARATIONS. Asking every check to name its inputs is more precise and is a hand-kept list, which is the fault deploy_sensitive exists to avoid, so there are three derived classes: code, data and site. They over-approximate, so a refactor re-runs everything, which is correct; what they buy is the common case of a data update with the code standing still.
          A PASS IS REMEMBERED AND A FAILURE NEVER IS, so the cache can only hold "this said nothing on exactly these inputs". A budget carries its number and is still compared against the recorded one every run.
          TWO RUNS WERE INVALIDATING THEMSELVES. The gate regenerates docs/tracker.html, which is tracked and carries the time it ran, so every gate moved the code class and the next re-answered all 110 checks. The same for checks.json under data/build, which carries per-check timings and made every cycle re-run the ten suites that read the build, check.py --self-test among them: 16 s spent proving nothing had changed by changing it.
          What a run WRITES is not what a run READS, and both are now out of the keys.
          Nine cases in test_incremental.py hold the keys: every class moves them, two checks never share one, and `site` moves a key only for a check deploy_sensitive derives as reading the deployed tree.
          Proved end to end by planting an unevidenced impossibility in adapters/greentree.py and watching the incremental gate refuse it.
      - id: F3
        title: Incremental build, stages keyed on the digest of their inputs
        state: todo
      - id: F4
        title: The gate and the tests run concurrently, being independent of each other
        state: done
        note: >-
          ./cycle.py. 27.4 s together against 54.3 s one after the other, and 82 s before this stage began.
          THEY WERE ALSO BOTH PROVING THE SAME THING: ./test.py runs check.py --self-test as one of its suites and --gate runs the very same self-test before it will pass anything, 16 s each in one cycle.
          The tests carry it and the gate is told so by --proved-by, which is sound only because the driver reports failure when the test half fails; nothing but cycle.py passes the flag and --full never does.
          The pre-push hook runs the driver rather than the two in sequence.
          Separately, the copy a canary is planted into was 18.3 of the self-test's 18.4 seconds: twelve million deepcopy calls over data that came out of JSON, where only the containers need copying and a string cannot be mutated. Anything unrecognised still goes to deepcopy, and the fingerprint taken before any probe ran is the net under it. 18.4 s to 16.1 s.
      - id: F5
        title: A cache-free --full path, which the scheduled CI run exercises end to end
        state: done
        note: >-
          ./cycle.py --full. Each half proves itself, YURA_NO_TOKEN refuses the green-tree token, and the per-file cache is MOVED ASIDE rather than deleted, so a run that disagrees with the incremental one leaves both answers on disk to compare.
          64.9 s against 27.4 s, slower on purpose: a cycle that only ever runs the fast path has never checked that the fast path agrees with anything.
          It found a real fault the first time it ran. greentree's own self-test failed under YURA_NO_TOKEN, because the override refuses every token and the suite read that as a token wrongly refused, so the one run that most needs the suite was the one run where it could not pass. The override is now a case the suite tests and then sets aside.
